configuration:
  timezone:
    name: Zona horaria
    description: "Zona horaria IANA (p. ej. America/New_York), o auto para detectar desde Home Assistant Core (reserva Etc/UTC)."

  addon_log_level:
    name: Nivel de log del complemento
    description: Verbosidad de los logs de inicio del contenedor del complemento (colores y emojis cuando el terminal de logs es interactivo).
    options:
      error: "Solo errores"
      warn: "Advertencias y errores"
      info: "Info (predeterminado)"
      debug: "Debug (detallado)"

  setup_profile:
    name: Perfil de configuración
    description: "Preset de primer arranque. home_assistant habilita LAN HTTPS, MCP automático con token y bootstrap de model/browser/timezone. general usa solo acceso local. advanced usa solo opciones individuales."
    options:
      home_assistant: "Home Assistant (recomendado)"
      general: "Asistente general"
      advanced: "Avanzado (opciones manuales)"

  default_provider:
    name: Proveedor predeterminado
    description: "Proveedor LLM principal para el primer arranque. Nous Portal usa OAuth (`hermes setup --portal` o `hermes auth add nous` en terminal). Ollama corresponde a Ollama Cloud (`ollama-cloud`)."
    options:
      nous: "Nous Portal"
      openrouter: "OpenRouter"
      google: "Google (clave API Gemini)"
      anthropic: "Anthropic"
      ollama: "Ollama Cloud"
      minimax: "MiniMax"
      xai: "xAI (Grok)"
      openai: "OpenAI"
      lm_studio: "LM Studio (local)"

  default_model_preset:
    name: Preajuste de modelo
    description: "Usa Custom y define el ID del modelo en Modelo predeterminado."
    options:
      custom: "ID de modelo personalizado"

  default_model:
    name: Modelo predeterminado
    description: "ID del modelo para el proveedor seleccionado (p. ej. google/gemini-2.5-flash para OpenRouter, claude-sonnet-4-6 para Anthropic, gpt-oss:120b para Ollama Cloud). Bootstrap solo en el primer arranque si no hay modelo configurado."

  lm_studio_base_url:
    name: URL base de LM Studio
    description: "URL base compatible con OpenAI cuando default_provider=lm_studio (p. ej. http://192.168.1.10:1234/v1)."

  provider_api_keys:
    name: Claves API de proveedores
    description: Tokens opcionales de proveedores y herramientas sincronizados en /config/.hermes/.env al reiniciar. Los proveedores OAuth/device-code aún requieren `hermes auth` en el terminal.
    fields:
      openai_api_key:
        name: Clave API de OpenAI
        description: Sincronizada como OPENAI_API_KEY.
      openrouter_api_key:
        name: Clave API de OpenRouter
        description: Sincronizada como OPENROUTER_API_KEY.
      anthropic_api_key:
        name: Clave API de Anthropic
        description: Sincronizada como ANTHROPIC_API_KEY.
      google_api_key:
        name: Clave API de Google
        description: Sincronizada como GOOGLE_API_KEY.
      ollama_api_key:
        name: Clave API de Ollama Cloud
        description: Sincronizada como OLLAMA_API_KEY (desde ollama.com/settings/keys).
      minimax_api_key:
        name: Clave API de MiniMax
        description: Sincronizada como MINIMAX_API_KEY.
      discord_bot_token:
        name: Token de bot de Discord
        description: Sincronizado como DISCORD_BOT_TOKEN.
      github_token:
        name: Token de GitHub
        description: Sincronizado como GITHUB_TOKEN.
      xai_api_key:
        name: Clave API de xAI
        description: Sincronizada como XAI_API_KEY.
      firecrawl_api_key:
        name: Clave API de Firecrawl
        description: Sincronizada como FIRECRAWL_API_KEY.
      searxng_url:
        name: URL de SearXNG
        description: Sincronizada como SEARXNG_URL.

  home_assistant:
    name: Integración con Home Assistant
    description: Conecta Hermes a su instancia de Home Assistant para MCP, scripts y autodetección. Cada campo tiene un test en la interfaz web (Pruebas de conexión).
    fields:
      hass_url:
        name: URL de Home Assistant
        description: "Déjela vacía para autodetección en HAOS (recomendado). Pruebas de conexión → Test URL."
      homeassistant_token:
        name: Token de Home Assistant
        description: "Token de larga duración para MCP y herramientas de HA. Opcional cuando prefer_supervisor_token está ACTIVADO (usa SUPERVISOR_TOKEN). Enmascarado tras guardar; los tokens de usuario persisten en /config/secrets/homeassistant.token."
      prefer_supervisor_token:
        name: Preferir token del Supervisor
        description: "Cuando está ACTIVADO y no hay token de larga duración, usa SUPERVISOR_TOKEN (requiere homeassistant_api). No escribe el token del supervisor en secrets."
      auto_configure_mcp:
        name: Configurar MCP automáticamente para Home Assistant
        description: "Cuando está ACTIVADO y el token está configurado, registra Home Assistant en MCP al iniciar. Tras reiniciar: Pruebas de conexión → Test MCP."
      enable_native_ha_platform:
        name: Activar plataforma nativa HA del Gateway
        description: "Opt-in: rellena platforms.homeassistant con filtros de eventos seguros (binary_sensor, alarm, climate). HASS_TOKEN sigue habilitando las herramientas de dispositivos HA de forma independiente. Predeterminado DESACTIVADO — active para eventos state_changed reactivos."
      ha_system_prompt_hint:
        name: Sugerencia de system prompt de HA
        description: Contexto corto opcional almacenado con el bloque de plataforma nativa HA (solo se aplica cuando se ejecuta el bootstrap de plataforma nativa).

  agent_behavior:
    name: Comportamiento del agente
    description: Bootstrap de primer arranque para aprobaciones y reasoning de Hermes (escribe claves solo si faltan en /config/.hermes/config.yaml).
    fields:
      approval_mode:
        name: Modo de aprobación
        description: "Aprobaciones de comandos peligrosos. smart (recomendado para HA headless) usa un LLM auxiliar; manual siempre pregunta; off es YOLO."
        options:
          smart: "Smart (predeterminado)"
          manual: "Manual"
          off: "Desactivado (yolo)"
      reasoning_effort:
        name: Esfuerzo de reasoning
        description: Esfuerzo de pensamiento predeterminado para modelos que lo admiten (none…ultra).
        options:
          none: "none"
          minimal: "minimal"
          low: "low"
          medium: "medium (predeterminado)"
          high: "high"
          xhigh: "xhigh"
          max: "max"
          ultra: "ultra"
      show_reasoning:
        name: Mostrar reasoning
        description: Transmitir trazas de pensamiento del modelo (display.show_reasoning). Recomendado ACTIVADO.


  webhooks:
    name: Webhooks
    description: "Adaptador webhook opcional de Hermes (red del host). Direct-delivery puede enviar notificaciones HA sin LLM."
    fields:
      enable_webhooks:
        name: Activar webhooks
        description: "Si está ACTIVADO, configura WEBHOOK_* en .env y rellena platforms.webhook (puerto 8644). Secreto HMAC en /config/secrets/webhook.secret."
      webhook_port:
        name: Puerto de webhooks
        description: "Puerto HTTP para POST /webhooks/<route> (red del host). Predeterminado 8644."
      seed_ha_direct_delivery_route:
        name: Sembrar ruta HA direct-delivery
        description: "Si está ACTIVADO y los webhooks son nuevos, siembra la ruta ha-alert (deliver_only → homeassistant). Campo {message}."

  backup:
    name: Copia de seguridad
    description: "Escribe copias de Hermes en /share/hermes/backups (visible en el share de HAOS)."
    fields:
      auto_backup_on_start:
        name: Copia automática al iniciar
        description: "Si está ACTIVADO, copia rápida a /share/hermes/backups en cada arranque. Manual: hermes-backup-share."


  ntfy:
    name: ntfy
    description: "Plataforma ntfy opcional (push/cron). Predeterminado DESACTIVADO."
    fields:
      enable_ntfy:
        name: Activar ntfy
        description: "Si está ACTIVADO y hay topic, sincroniza NTFY_* en /config/.hermes/.env."
      ntfy_topic:
        name: Tema ntfy
        description: Nombre del tema para publish/subscribe.
      ntfy_server_url:
        name: URL del servidor ntfy
        description: "Predeterminado https://ntfy.sh — use su servidor propio."
      ntfy_token:
        name: Token ntfy
        description: "Bearer opcional o user:pass. Enmascarado; en /config/secrets/ntfy.token."
      ntfy_publish_only:
        name: Solo publicación
        description: "Si está ACTIVADO, solo push (sin chat entrante). Recomendado para alertas HA."

  enable_terminal:
    name: Activar terminal web
    description: Activar terminal web en Ingress. Pruebas de conexión → Test Terminal.

  terminal_port:
    name: Puerto del terminal
    description: Puerto del terminal web (predeterminado 7681). Pruebas de conexión → Test Terminal.

  web_interface:
    name: Hermes Web UI
    description: Interfaz Hermes (hermes dashboard). HTTPS externo en gateway_port. Cada campo tiene un test en Pruebas de conexión.
    fields:
      enable_web_interface:
        name: Activar Hermes Web UI
        description: Ejecuta hermes dashboard. Pruebas de conexión → Test Dashboard.
      auto_start_with_integration:
        name: Inicio automático con el complemento
        description: Inicia hermes dashboard al arrancar. Requerido para Test Dashboard.

  gateway_access:
    name: Acceso al Gateway
    description: Acceso de red y API Assist. Cada campo relevante tiene un test en Pruebas de conexión.
    fields:
      access_mode:
        name: Modo de acceso
        description: "Simplifica la configuración de acceso seguro. Anula bind/auth cuando no es Personalizado."
        options:
          custom: "Personalizado (configuración individual)"
          local_only: "Solo local (loopback + token, solo Ingress)"
          lan_https: "LAN HTTPS (proxy HTTPS integrado — recomendado para teléfonos)"
          lan_reverse_proxy: "LAN Proxy inverso (proxy externo con auth trusted-proxy)"
          tailnet_https: "Tailscale HTTPS (Tailscale + token)"
      gateway_port:
        name: Puerto del Gateway
        description: Puerto HTTPS de Hermes Web UI (18789). Pruebas de conexión → Test Web UI HTTPS.
      gateway_public_url:
        name: URL pública del Gateway
        description: URL base pública para abrir Hermes Web UI en una nueva pestaña (no integrada).
      enable_openai_api:
        name: Activar API OpenAI
        description: "Activa la API Assist. Tras reiniciar: Pruebas de conexión → Test Assist API."
      gateway_mode:
        name: Modo del Gateway
        description: Local (Test Gateway) o remoto (Test Remote).
        options:
          local: "Local (recomendado)"
          remote: "Remoto"
      gateway_remote_url:
        name: URL del Gateway Remoto
        description: URL WebSocket en modo remoto. Pruebas de conexión → Test Remote.
      gateway_bind_mode:
        name: Modo de enlace del Gateway
        description: "Enlace loopback, LAN o Tailscale. Solo tiene efecto cuando el Modo de acceso es Personalizado — otros preajustes lo configuran automáticamente e ignoran este valor."
        options:
          loopback: "Loopback (solo 127.0.0.1, más seguro)"
          lan: "LAN (todas las interfaces)"
          tailnet: "Tailnet (solo Tailscale)"
      gateway_auth_mode:
        name: Modo de autenticación del Gateway
        description: "Token (predeterminado) o trusted-proxy para proxys inversos. Solo tiene efecto cuando el Modo de acceso es Personalizado — otros preajustes lo configuran automáticamente e ignoran este valor."
        options:
          token: "Token (predeterminado)"
          trusted-proxy: "Proxy de confianza (para proxys inversos)"
      gateway_trusted_proxies:
        name: Proxys de confianza del Gateway
        description: "Lista de IP/CIDR de reverse proxy de confianza para gateway_auth_mode trusted-proxy (una fila por proxy). Requerido con access_mode lan_reverse_proxy o proxy externo (NPM, Caddy, Traefik). Si está vacío en lan_reverse_proxy, el inicio aplica valores por defecto (127.0.0.1, 172.30.0.0/16, 10.0.0.0/8). El proxy debe enviar X-Forwarded-User."
        fields:
          value:
            name: IP o CIDR del proxy
            description: "IPv4, IPv4/CIDR o IPv6/CIDR del origen del proxy. Ejemplos: 127.0.0.1, 192.168.88.0/24, 172.30.0.0/16."
      gateway_additional_allowed_origins:
        name: Orígenes permitidos adicionales
        description: "Orígenes de navegador adicionales para la Control UI de Hermes (una fila por origen). Se combinan con los valores predeterminados en gateway.controlUi.allowedOrigins. En lan_https, los hostnames también se añaden al SAN del certificado TLS."
        fields:
          value:
            name: URL de origen
            description: "Origen completo con esquema y host (incluya el puerto si no es el predeterminado). Ejemplos: https://ha.example.com:8443, https://homeassistant.local:8123, capacitor://localhost."
      controlui_disable_device_auth:
        name: Desactivar emparejamiento por dispositivo en Control UI (lan_https)
        description: "Recomendado ACTIVADO para LAN doméstica — omite aprobación por dispositivo (evita error 1008)."

  mqtt_settings:
    name: Sensores de estado MQTT
    description: Conexión al broker y sensores MQTT. Cada campo del broker tiene un test en Pruebas de conexión.
    fields:
      broker_host:
        name: Host del broker MQTT
        description: "IP o nombre de host del broker. Vacío = autodetectar Mosquitto. Pruebas de conexión → Test Broker."
      broker_port:
        name: Puerto del broker MQTT
        description: Puerto del broker MQTT (1883). Incluido en Test Broker.
      broker_username:
        name: Usuario MQTT
        description: Usuario Mosquitto opcional. Pruebas de conexión → Test Auth si está configurado.
      broker_password:
        name: Contraseña MQTT
        description: Contraseña Mosquitto opcional. Pruebas de conexión → Test Auth.
      enable_ha_status_sensors:
        name: Sensores de estado HA
        description: Publica configuración, salud del gateway, modelo/proveedor y métricas de uso a Home Assistant.
      publish_mqtt_discovery:
        name: Publicar MQTT discovery
        description: Crear entidades HA una vez por versión del complemento (marcador /config/.hermes/.mqtt_discovery_published). Desactivar para usar solo /status.json.
      status_poll_interval_seconds:
        name: Intervalo de estado (segundos)
        description: Intervalo de actualización para sensores y /share/hermes/status.json (30-300).
      state_prefix:
        name: Prefijo de topics MQTT
        description: "Prefijo para topics de estado (predeterminado hermes). Ejemplo: hermes/status/gateway_running."

  router_ssh:
    name: SSH del router
    description: Acceso SSH opcional a un router o dispositivo de red accesible desde la LAN del host HA.
    fields:
      host:
        name: Host SSH del router
        description: Nombre de host o dirección IP del router/firewall.
      user:
        name: Usuario SSH del router
        description: Nombre de usuario SSH para acceso al router.
      key_path:
        name: Ruta de clave SSH del router
        description: Ruta a la clave privada en almacenamiento persistente (predeterminado /config/keys/router_ssh).

  tools_bootstrap:
    name: Bootstrap de herramientas
    description: Verificar e instalar automáticamente dependencias opcionales de herramientas Hermes al inicio.
    fields:
      tool_telegram_enabled:
        name: Activar bootstrap de herramienta Telegram
        description: Instalar automáticamente dependencias Python de Telegram cuando falten.
      tool_discord_enabled:
        name: Activar bootstrap de herramienta Discord
        description: Instalar automáticamente dependencias Python de Discord cuando haya un token de bot configurado. Desactívalo para conservar un token guardado sin instalar/ejecutar el bot de Discord.
      tool_browser_enabled:
        name: Activar bootstrap de herramienta Browser
        description: Instalar automáticamente dependencias del navegador (p. ej. agent-browser) cuando falten.
      tool_skills_hub_enabled:
        name: Activar bootstrap de Skills Hub
        description: Inicializar el directorio de Skills Hub al inicio (como `hermes skills list` en el primer arranque).
      seed_example_scripts:
        name: Sembrar scripts de ejemplo
        description: "Copia disk-alert.sh y morning-heartbeat.sh a /config/.hermes/scripts/ si faltan (para cron no_agent)."

  advanced_settings:
    name: Configuración avanzada
    description: Proxy, DNS, logs de nginx, variables de entorno del gateway, versión de Hermes y limpieza de bloqueos de sesión.
    fields:
      http_proxy:
        name: Proxy HTTP de salida
        description: URL de proxy opcional para HTTP/HTTPS saliente (ejemplo http://192.168.2.1:3128).
      force_ipv4_dns:
        name: Forzar orden DNS IPv4
        description: Recomendado ACTIVADO en HAOS — evita timeouts de salida IPv6 para web_fetch y Telegram.
      nginx_log_level:
        name: Nivel de log Nginx
        description: Verbosidad del log de acceso del proxy HTTPS integrado.
        options:
          minimal: "Mínimo (suprimir ruido de polling HA)"
          full: "Completo (registrar todas las solicitudes)"
      gateway_env_vars:
        name: Variables de entorno del Gateway
        description: Variables de entorno adicionales para el proceso del gateway (máx. 50 entradas).
      hermes_agent_version_preset:
        name: Versión de Hermes Agent
        description: Paquete npm para la CLI `hermes` — latest o versión personalizada.
        options:
          latest: "Latest (npm @latest)"
          custom: "Versión personalizada (predeterminado 0.19.0)"
      hermes_agent_version_custom:
        name: Versión de Hermes Agent (personalizada)
        description: dist-tag npm o semver cuando el preajuste es personalizado (predeterminado 0.19.0).

      fallback_providers:
        name: Proveedores de respaldo
        description: "Bootstrap de fallback_providers si faltan. Entradas como openrouter u openrouter/google/gemini-2.5-flash. Vacío = omitir."
      nous_tool_gateway:
        name: Nous Tool Gateway
        description: "Si está ACTIVADO, siembra use_gateway: true en web/image_gen/tts/browser (requiere suscripción Nous Portal)."
      gateway_drain_seconds:
        name: Segundos de drain del gateway
        description: "Segundos de espera del drain al detener el complemento (0–120). Predeterminado 15."
      clean_session_locks_on_start:
        name: Limpiar bloqueos de sesión al iniciar
        description: Eliminar archivos de bloqueo de sesión obsoletos cuando el complemento inicia.
      clean_session_locks_on_exit:
        name: Limpiar bloqueos de sesión al salir
        description: Eliminar archivos de bloqueo de sesión al apagar correctamente.

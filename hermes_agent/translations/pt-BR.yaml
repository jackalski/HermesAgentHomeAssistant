configuration:
  timezone:
    name: Fuso Horário
    description: Fuso horário IANA (ex. America/Sao_Paulo), ou auto para detectar pelo Home Assistant Core (reserva Etc/UTC).
  addon_log_level:
    name: Nível de log do add-on
    description: Verbosidade dos logs de inicialização do contêiner do add-on (cores e emojis quando o terminal de log é interativo).
    options:
      error: Somente erros
      warn: Avisos e erros
      info: Info (padrão)
      debug: Debug (detalhado)
  setup_profile:
    name: Perfil de configuração
    description: Preset de primeira execução. home_assistant habilita LAN HTTPS, MCP automático com token e bootstrap de model/browser/timezone. general usa acesso apenas local. advanced usa somente opções individuais.
    options:
      home_assistant: Home Assistant (recomendado)
      general: Assistente geral
      advanced: Avançado (opções manuais)
  default_provider:
    name: Provedor padrão
    description: Provedor LLM principal para a primeira execução. Nous Portal usa OAuth (`hermes setup --portal` ou `hermes auth add nous` no terminal). Ollama corresponde a Ollama Cloud (`ollama-cloud`).
    options:
      nous: Nous Portal
      openrouter: OpenRouter
      google: Google (chave API Gemini)
      anthropic: Anthropic
      ollama: Ollama Cloud
      minimax: MiniMax
      xai: xAI (Grok)
      openai: OpenAI
      lm_studio: LM Studio (local)
  default_model_preset:
    name: Predefinição de modelo
    description: Use Custom e defina o ID do modelo em Modelo padrão.
    options:
      custom: ID de modelo personalizado
  default_model:
    name: Modelo padrão
    description: ID do modelo para o provedor selecionado (ex. google/gemini-2.5-flash para OpenRouter, claude-sonnet-4-6 para Anthropic, gpt-oss:120b para Ollama Cloud). Bootstrap apenas na primeira execução quando nenhum modelo estiver configurado.
  lm_studio_base_url:
    name: URL base do LM Studio
    description: URL base compatível com OpenAI quando default_provider=lm_studio (ex. http://192.168.1.10:1234/v1).
  provider_api_keys:
    name: Chaves API de provedores
    description: Tokens opcionais de provedores e ferramentas sincronizados em /config/.hermes/.env ao reiniciar. Provedores OAuth/device-code ainda exigem `hermes auth` no terminal.
    fields:
      openai_api_key:
        name: Chave API OpenAI
        description: Sincronizada como OPENAI_API_KEY.
      openrouter_api_key:
        name: Chave API OpenRouter
        description: Sincronizada como OPENROUTER_API_KEY.
      anthropic_api_key:
        name: Chave API Anthropic
        description: Sincronizada como ANTHROPIC_API_KEY.
      google_api_key:
        name: Chave API Google
        description: Sincronizada como GOOGLE_API_KEY.
      ollama_api_key:
        name: Chave API Ollama Cloud
        description: Sincronizada como OLLAMA_API_KEY (de ollama.com/settings/keys).
      minimax_api_key:
        name: Chave API MiniMax
        description: Sincronizada como MINIMAX_API_KEY.
      discord_bot_token:
        name: Token de bot do Discord
        description: Sincronizado como DISCORD_BOT_TOKEN.
      github_token:
        name: Token do GitHub
        description: Sincronizado como GITHUB_TOKEN.
      xai_api_key:
        name: Chave API xAI
        description: Sincronizada como XAI_API_KEY.
      firecrawl_api_key:
        name: Chave API Firecrawl
        description: Sincronizada como FIRECRAWL_API_KEY.
      searxng_url:
        name: URL SearXNG
        description: Sincronizada como SEARXNG_URL.
      elevenlabs_api_key:
        name: ElevenLabs API Key
        description: Synced as ELEVENLABS_API_KEY (premium TTS / STT).
      groq_api_key:
        name: Groq API Key
        description: Synced as GROQ_API_KEY (Groq Whisper STT).
      deepinfra_api_key:
        name: DeepInfra API Key
        description: Synced as DEEPINFRA_API_KEY (optional STT/TTS provider).
  home_assistant:
    name: Integração com Home Assistant
    description: Conecta o Hermes ao Home Assistant. Cada campo tem um teste em Testes de conexão.
    fields:
      hass_url:
        name: URL do Home Assistant
        description: Deixe vazio para autodetecção no HAOS (recomendado). Sincronizada como HOMEASSISTANT_URL em /config/.hermes/.env quando o token estiver definido.
      homeassistant_token:
        name: Token do Home Assistant
        description: Token de longa duração para MCP e ferramentas do HA. Opcional quando prefer_supervisor_token estiver LIGADO (usa SUPERVISOR_TOKEN). Mascarado após salvar; tokens de usuário em /config/secrets/homeassistant.token.
      prefer_supervisor_token:
        name: Preferir token do Supervisor
        description: Quando LIGADO e nenhum token de longa duração for colado, usa SUPERVISOR_TOKEN (requer homeassistant_api). Não grava o token do supervisor em secrets.
      auto_configure_mcp:
        name: Configurar MCP automaticamente para o Home Assistant
        description: Quando LIGADO e o token estiver definido, registra o Home Assistant no MCP do Hermes (mcp_servers) a cada inicialização.
      enable_native_ha_platform:
        name: Ativar plataforma nativa HA do Gateway
        description: 'Opt-in: preenche platforms.homeassistant com filtros de eventos seguros (binary_sensor, alarm, climate). HASS_TOKEN ainda habilita ferramentas de dispositivos HA de forma independente. Padrão DESLIGADO — ative para eventos state_changed reativos.'
      ha_system_prompt_hint:
        name: Dica de system prompt do HA
        description: Contexto curto opcional armazenado com o bloco da plataforma nativa HA (aplicado somente quando o bootstrap da plataforma nativa é executado).
  voice_speech:
    name: Voice & Speech
    description: Hermes STT/TTS for gateway voice notes and the text_to_speech tool. Wake words and microphones stay on HA Voice satellites — this add-on has no audio device.
    fields:
      stt_enabled:
        name: Enable STT
        description: Auto-transcribe inbound voice messages on messaging platforms (stt.enabled).
      stt_provider:
        name: STT Provider
        description: local (faster-whisper), groq, openai, mistral, xai, elevenlabs, or deepinfra.
        options:
          local: Local (faster-whisper)
          groq: Groq
          openai: OpenAI
          mistral: Mistral
          xai: xAI
          elevenlabs: ElevenLabs
          deepinfra: DeepInfra
      stt_language:
        name: STT Language
        description: ISO language code (e.g. en, pl, de). Use auto to detect from Home Assistant Core language (or provider auto-detect).
      stt_local_model:
        name: Local STT Model
        description: faster-whisper model size when STT provider is local.
        options:
          tiny: tiny
          base: base (default)
          small: small
          medium: medium
          large-v3: large-v3
      stt_echo_transcripts:
        name: Echo Transcripts
        description: Post raw transcripts back to chat as voice-note captions.
      tts_provider:
        name: TTS Provider
        description: edge (free default), piper, kittentts, openai, elevenlabs, gemini, xai, minimax, mistral, or neutts.
        options:
          edge: Edge TTS (default)
          piper: Piper
          kittentts: KittenTTS
          openai: OpenAI
          elevenlabs: ElevenLabs
          gemini: Gemini
          xai: xAI
          minimax: MiniMax
          mistral: Mistral
          neutts: NeuTTS
      tts_voice:
        name: TTS Voice
        description: Provider-specific voice id (e.g. en-US-AriaNeural for Edge, en_US-lessac-medium for Piper).
      tts_speed:
        name: TTS Speed
        description: Global speech speed multiplier (0.5–2.0).
  ha_voice_bridge:
    name: HA Voice Bridge
    description: Wire Hermes to Home Assistant Assist satellites — Assist inbound (brain) and spoken announcements outbound.
    fields:
      seed_ha_speak_route:
        name: Seed ha-speak Webhook Route
        description: When webhooks are enabled, seed route ha-speak (deliver_only → homeassistant) for zero-LLM spoken announcements.
      seed_ha_tts_command_script:
        name: Seed HA TTS Command Script
        description: Copy ha-tts-command.py into /config/.hermes/scripts/ so Hermes can speak via HA Piper / Cloud TTS.
  agent_behavior:
    name: Comportamento do agente
    description: Bootstrap de primeira execução para aprovações e reasoning do Hermes (grava chaves somente se estiverem ausentes em /config/.hermes/config.yaml).
    fields:
      approval_mode:
        name: Modo de aprovação
        description: Aprovações de comandos perigosos. smart (recomendado para HA headless) usa um LLM auxiliar; manual sempre pergunta; off é YOLO.
        options:
          smart: Smart (padrão)
          manual: Manual
          false: Desligado (yolo)
      reasoning_effort:
        name: Esforço de reasoning
        description: Esforço de pensamento padrão para modelos que o suportam (none…ultra).
        options:
          none: none
          minimal: minimal
          low: low
          medium: medium (padrão)
          high: high
          xhigh: xhigh
          max: max
          ultra: ultra
      show_reasoning:
        name: Mostrar reasoning
        description: Transmitir rastros de pensamento do modelo (display.show_reasoning). Recomendado LIGADO.
      max_turns:
        name: Max Turns
        description: Max tool iterations per turn (agent.max_turns). Upstream default is 500; 60 is safer for Assist / home use.
      smart_policy:
        name: Smart Approval Policy
        description: Optional extra rules appended to the smart-approval reviewer (approvals.smart_policy).
      denial_breaker_threshold:
        name: Denial Breaker Threshold
        description: Stop after N consecutive smart-approval denials (0 disables). Default 3.
      deny_patterns:
        name: Deny Patterns
        description: Glob patterns that always block terminal commands (approvals.deny). Seeded with HA-safe defaults when missing.
  context_compression:
    name: Context Compression
    description: Hermes conversation compression / pruning (writes keys only if missing).
    fields:
      threshold_tokens:
        name: Absolute Token Threshold
        description: Compress when context exceeds this many tokens (0 = use ratio threshold only).
      proactive_prune_tokens:
        name: Proactive Prune Tokens
        description: Prune oversized tool results without an LLM when re-sent history exceeds this (0 = off; try 48000).
      min_tail_user_messages:
        name: Min Tail User Messages
        description: Guaranteed number of recent user messages to keep after compression.
      idle_compact_after_seconds:
        name: Idle Compact After Seconds
        description: Opt-in idle compaction delay (0 = disabled).
  webhooks:
    name: Webhooks
    description: Adaptador webhook opcional do Hermes (rede do host). Direct-delivery pode enviar notificações HA sem LLM.
    fields:
      enable_webhooks:
        name: Ativar webhooks
        description: Quando LIGADO, define WEBHOOK_* no .env e preenche platforms.webhook (porta 8644). Segredo HMAC em /config/secrets/webhook.secret.
      webhook_port:
        name: Porta dos webhooks
        description: Porta HTTP para POST /webhooks/<route> (rede do host). Padrão 8644.
      seed_ha_direct_delivery_route:
        name: Semear rota HA direct-delivery
        description: Quando LIGADO e webhooks são novos, semeia a rota ha-alert (deliver_only → homeassistant). Campo {message}.
  outbound_events:
    name: Outbound Events
    description: Push signed Hermes lifecycle events to a Home Assistant webhook (requires Hermes that supports hooks.outbound).
    fields:
      enable_outbound_events:
        name: Enable Outbound Events
        description: When ON and ha_webhook_id is set, seed hooks.outbound (capability-probed). HMAC secret at /config/secrets/outbound_webhook.secret.
      ha_webhook_id:
        name: HA Webhook ID
        description: Home Assistant webhook id (Settings → Automations → Webhook). Pair with the Hermes voice announce blueprint.
      events:
        name: Event Types
        description: Lifecycle event names to forward (default turn.completed).
  backup:
    name: Backup
    description: Grava backups do Hermes em /share/hermes/backups (visível no share do HAOS).
    fields:
      auto_backup_on_start:
        name: Backup automático no início
        description: 'Quando LIGADO, backup rápido para /share/hermes/backups a cada start. Manual: hermes-backup-share.'
  ntfy:
    name: ntfy
    description: Plataforma ntfy opcional (push/cron). Padrão DESLIGADO.
    fields:
      enable_ntfy:
        name: Ativar ntfy
        description: Quando LIGADO e topic definido, sincroniza NTFY_* em /config/.hermes/.env.
      ntfy_topic:
        name: Tópico ntfy
        description: Nome do tópico para publish/subscribe.
      ntfy_server_url:
        name: URL do servidor ntfy
        description: Padrão https://ntfy.sh — use servidor próprio para privacidade.
      ntfy_token:
        name: Token ntfy
        description: Bearer opcional ou user:pass. Mascarado; em /config/secrets/ntfy.token.
      ntfy_publish_only:
        name: Somente publicação
        description: Quando LIGADO, só push (sem chat de entrada). Recomendado para alertas HA.
  enable_terminal:
    name: Habilitar Terminal Web
    description: Habilitar botão do terminal web dentro do Home Assistant (Ingress) via ttyd
  terminal_port:
    name: Porta do Terminal
    description: Porta para o terminal web (padrão 7681). Altere se esta porta conflitar com outro serviço.
  web_interface:
    name: Hermes Web UI
    description: Painel Hermes (hermes dashboard). HTTPS externo em gateway_port. Cada campo tem um teste em Testes de conexão.
    fields:
      enable_web_interface:
        name: Ativar Hermes Web UI
        description: Executa hermes dashboard. Testes de conexão → Test Dashboard.
      auto_start_with_integration:
        name: Iniciar automaticamente com o add-on
        description: Inicia hermes dashboard ao iniciar o add-on. Necessário para Test Dashboard.
  gateway_access:
    name: Acesso ao Gateway
    description: Acesso de rede e API Assist. Cada campo relevante tem um teste em Testes de conexão.
    fields:
      access_mode:
        name: Modo de Acesso
        description: Simplifica a configuração de acesso seguro. Substitui bind/auth quando não é Personalizado.
        options:
          custom: Personalizado (configurações individuais)
          local_only: Apenas local (loopback + token, apenas Ingress)
          lan_https: LAN HTTPS (proxy HTTPS integrado — recomendado para celulares)
          lan_reverse_proxy: LAN Reverse Proxy (proxy externo com auth trusted-proxy)
          tailnet_https: Tailscale HTTPS (Tailscale + token)
      gateway_port:
        name: Porta do Gateway
        description: Porta HTTPS do Hermes Web UI (padrão 18789). Testes de conexão → Test Web UI HTTPS.
      gateway_public_url:
        name: URL Pública do Gateway
        description: URL base pública para abrir Hermes Web UI em uma nova aba (não incorporada).
      enable_openai_api:
        name: Habilitar API OpenAI
        description: 'Ativa a API Assist do Hermes (API_SERVER_ENABLED). Extended OpenAI do HA Core: http://<LAN-IP>:8642/v1.'
      gateway_mode:
        name: Modo do Gateway
        description: Local (gateway no add-on) ou remoto (conexão a gateway externo).
        options:
          local: Local (recomendado)
          remote: Remoto
      gateway_remote_url:
        name: URL do Gateway Remoto
        description: URL WebSocket quando o Modo do Gateway é Remoto.
      gateway_bind_mode:
        name: Modo de Vinculação do Gateway
        description: Vinculação loopback, LAN ou Tailscale. Só tem efeito quando o Modo de Acesso é Personalizado — outras predefinições configuram isso automaticamente e ignoram este valor.
        options:
          loopback: Loopback (somente 127.0.0.1, mais seguro)
          lan: LAN (todas as interfaces)
          tailnet: Tailnet (somente Tailscale)
      gateway_auth_mode:
        name: Modo de Autenticação do Gateway
        description: Token (padrão) ou trusted-proxy para reverse proxies. Só tem efeito quando o Modo de Acesso é Personalizado — outras predefinições configuram isso automaticamente e ignoram este valor.
        options:
          token: Token (padrão)
          trusted-proxy: Proxy Confiável (para reverse proxies)
      gateway_trusted_proxies:
        name: Proxies Confiáveis do Gateway
        description: Lista de IP/CIDR de reverse proxy confiável para gateway_auth_mode trusted-proxy (uma linha por proxy). Obrigatório com access_mode lan_reverse_proxy ou proxy externo (NPM, Caddy, Traefik). Se vazio em lan_reverse_proxy, a inicialização aplica padrões (127.0.0.1, 172.30.0.0/16, 10.0.0.0/8). O proxy deve enviar X-Forwarded-User.
        fields:
          value:
            name: IP ou CIDR do proxy
            description: 'IPv4, IPv4/CIDR ou IPv6/CIDR da origem do proxy. Exemplos: 127.0.0.1, 192.168.88.0/24, 172.30.0.0/16.'
      gateway_additional_allowed_origins:
        name: Origens permitidas adicionais
        description: Origens de navegador extras para a Control UI do Hermes (uma linha por origem). Mescladas com os padrões em gateway.controlUi.allowedOrigins. Em lan_https, hostnames também entram no SAN do certificado TLS.
        fields:
          value:
            name: URL de origem
            description: 'Origem completa com esquema e host (inclua a porta se não for a padrão). Exemplos: https://ha.example.com:8443, https://homeassistant.local, https://homeassistant.local:8123, capacitor://localhost.'
      controlui_disable_device_auth:
        name: Desativar pareamento por dispositivo no Control UI (lan_https)
        description: Recomendado LIGADO para LAN doméstica — pula aprovação por dispositivo (evita erro 1008).
  mqtt_settings:
    name: Sensores de status MQTT
    description: Conexão com o broker MQTT. Cada campo do broker tem um teste em Testes de conexão.
    fields:
      broker_host:
        name: Host do broker MQTT
        description: IP ou nome do host do broker. Deixe vazio para autodetectar Mosquitto (supervisor/bashio/loopback).
      broker_port:
        name: Porta do broker MQTT
        description: Porta do broker MQTT (padrão 1883).
      broker_username:
        name: Usuário MQTT
        description: Usuário Mosquitto opcional (deixe vazio quando a autenticação estiver desativada).
      broker_password:
        name: Senha MQTT
        description: Senha Mosquitto opcional. Mascarada após salvar. Persistida em /config/secrets/mqtt.password.
      enable_ha_status_sensors:
        name: Habilitar sensores de status HA
        description: Publica configuração, saúde do gateway, modelo/provedor e métricas de uso no Home Assistant.
      publish_mqtt_discovery:
        name: Publicar MQTT discovery
        description: Criar entidades HA uma vez por versão do add-on (marcador /config/.hermes/.mqtt_discovery_published). Desative para usar apenas /status.json.
      enable_control_entities:
        name: Ativar entidades de controle MQTT
        description: Desligado por padrão. Quando ligado, publica botões (reiniciar gateway, backup, limpeza, atualizar) e seletores (modo de aprovação, esforço de raciocínio) via MQTT. Quem tiver acesso de escrita ao broker pode acioná-los — ative apenas em um Mosquitto confiável.
      status_poll_interval_seconds:
        name: Intervalo de status (segundos)
        description: Intervalo de atualização para sensores e /share/hermes/status.json (30-300).
      state_prefix:
        name: Prefixo de tópicos MQTT
        description: 'Prefixo para tópicos de estado (padrão hermes). Exemplo: hermes/status/gateway_running.'
  router_ssh:
    name: SSH do roteador
    description: Acesso SSH opcional a um roteador ou dispositivo de rede acessível na LAN do host HA.
    fields:
      host:
        name: Host SSH do Roteador
        description: Nome do host ou endereço IP do roteador/firewall.
      user:
        name: Usuário SSH do Roteador
        description: Nome de usuário SSH para acesso ao roteador.
      key_path:
        name: Caminho da Chave SSH do Roteador
        description: Caminho para a chave privada em armazenamento persistente (padrão /config/keys/router_ssh).
  tools_bootstrap:
    name: Bootstrap de ferramentas
    description: Verificar e instalar automaticamente dependências opcionais de ferramentas Hermes na inicialização.
    fields:
      tool_telegram_enabled:
        name: Habilitar bootstrap da ferramenta Telegram
        description: Instalar automaticamente dependências Python do Telegram quando ausentes.
      tool_discord_enabled:
        name: Habilitar bootstrap da ferramenta Discord
        description: Instalar automaticamente dependências Python do Discord quando um token de bot estiver definido. Desative para manter um token salvo sem instalar/executar o bot do Discord.
      tool_browser_enabled:
        name: Habilitar bootstrap da ferramenta Browser
        description: Instalar automaticamente dependências de browser (ex. agent-browser) quando ausentes.
      tool_skills_hub_enabled:
        name: Habilitar bootstrap do Skills Hub
        description: Inicializar o diretório do Skills Hub na inicialização (como `hermes skills list` na primeira execução).
      seed_example_scripts:
        name: Semear scripts de exemplo
        description: Copia disk-alert.sh e morning-heartbeat.sh para /config/.hermes/scripts/ se ausentes (para cron no_agent).
      tool_a2a_enabled:
        name: Enable A2A Plugin
        description: Opt-in Agent-to-Agent (A2A v1.0) plugin when the installed Hermes supports it (capability-probed).
      tool_office_skills_enabled:
        name: Enable Office Skills Bootstrap
        description: Attempt to install bundled office skills (docx/xlsx/pdf/powerpoint) when available.
  advanced_settings:
    name: Configurações avançadas
    description: Proxy, DNS, logs do nginx, variáveis de ambiente do gateway, versão do Hermes e limpeza de bloqueios de sessão.
    fields:
      http_proxy:
        name: Proxy HTTP de saída
        description: URL de proxy opcional para HTTP/HTTPS de saída (exemplo http://192.168.2.1:3128).
      force_ipv4_dns:
        name: Forçar ordem DNS IPv4
        description: Recomendado LIGADO no HAOS — evita timeouts de saída IPv6 para web_fetch e Telegram.
      nginx_log_level:
        name: Nível de log Nginx
        description: Verbosidade do log de acesso do proxy HTTPS integrado.
        options:
          minimal: Mínimo (suprimir ruído de polling HA)
          full: Completo (registrar todas as requisições)
      gateway_env_vars:
        name: Variáveis de Ambiente do Gateway
        description: Variáveis de ambiente adicionais passadas ao processo do gateway (máx. 50 entradas).
      hermes_agent_version_preset:
        name: Fonte da versão do Hermes Agent
        description: Último release do GitHub, ou uma tag personalizada.
        options:
          latest: Último release do GitHub
          custom: Tag personalizada (padrão v2026.8.3)
      hermes_agent_version_custom:
        name: Versão do Hermes Agent (personalizada)
        description: Tag de release do GitHub (ex. v2026.8.3) ou versão do Hermes (ex. 0.20.0).
      fallback_providers:
        name: Provedores de fallback
        description: Bootstrap de fallback_providers quando ausente. Entradas como openrouter ou openrouter/google/gemini-2.5-flash. Vazio = pular.
      nous_tool_gateway:
        name: Nous Tool Gateway
        description: 'Quando LIGADO, semeia use_gateway: true em web/image_gen/tts/browser (requer assinatura Nous Portal).'
      gateway_drain_seconds:
        name: Segundos de drain do gateway
        description: Segundos de espera no drain ao parar o add-on (0–120). Padrão 15.
      clean_session_locks_on_start:
        name: Limpar Bloqueios de Sessão ao Iniciar
        description: Remover arquivos de bloqueio de sessão obsoletos quando o add-on iniciar.
      clean_session_locks_on_exit:
        name: Limpar Bloqueios de Sessão ao Sair
        description: Remover arquivos de bloqueio de sessão no encerramento normal.

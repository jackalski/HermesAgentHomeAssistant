blueprint:
  name: Hermes disk usage alert
  description: >
    Notify when sensor.hermes_disk_usage_percent crosses a threshold
    (/config volume inside the add-on).
  domain: automation
  source_url: https://github.com/jackalski/HermesAgentHomeAssistant
  input:
    disk_threshold:
      name: Disk usage threshold (%)
      default: 85
      selector:
        number:
          min: 50
          max: 99
          unit_of_measurement: "%"
          mode: slider

trigger:
  - platform: numeric_state
    entity_id: sensor.hermes_disk_usage_percent
    above: !input disk_threshold

action:
  - service: persistent_notification.create
    data:
      title: Hermes disk space low
      message: >
        Add-on /config disk is at {{ states('sensor.hermes_disk_usage_percent') }}%.
        Open the add-on terminal and run hermes-cleanup, or prune Docker images
        from a host root shell.
      notification_id: hermes_disk_alert

mode: single

blueprint:
  name: Hermes monthly budget alert
  description: >
    Notify when Hermes monthly spend (utility_meter over estimated cost) crosses
    a percentage of input_number.hermes_monthly_budget_usd.
  domain: automation
  source_url: https://github.com/jackalski/HermesAgentHomeAssistant
  input:
    budget_percent:
      name: Budget threshold (%)
      description: Fire when monthly spend reaches this percent of the budget.
      default: 80
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider

trigger:
  - platform: numeric_state
    entity_id: sensor.hermes_budget_used_percent
    above: !input budget_percent

condition:
  - condition: numeric_state
    entity_id: input_number.hermes_monthly_budget_usd
    above: 0

action:
  - service: persistent_notification.create
    data:
      title: Hermes budget alert
      message: >
        Monthly Hermes spend is {{ states('sensor.hermes_budget_used_percent') }}%
        of budget (${{ states('input_number.hermes_monthly_budget_usd') }}).
        Spent this month: ${{ states('sensor.hermes_cost_monthly') }}.
      notification_id: hermes_budget_alert

mode: single

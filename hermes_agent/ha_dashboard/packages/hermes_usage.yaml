# Hermes Agent usage helpers (Home Assistant package)
#
# Install:
#   1. Enable packages in configuration.yaml:
#        homeassistant:
#          packages: !include_dir_named packages
#   2. Copy this file to config/packages/hermes_usage.yaml
#      (source after add-on start: /share/hermes/ha/packages/hermes_usage.yaml)
#   3. Restart Home Assistant Core
#
# Entity IDs assume MQTT discovery object_id slugs from the Hermes Agent Integration
# add-on (sensor.hermes_*, binary_sensor.hermes_*; unique_id hermes_agent_ha_addon_*).
# If you renamed entities, update the references below.
#
# Prefer MQTT sensors when they exist. This package only adds helpers that MQTT
# does not publish as scalars (7d windows, failed-session cost, compression splits,
# top spender / breakdown tables, monthly budget) from sensor.hermes_usage_summary
# attributes and sensor.hermes_estimated_cost_usd.

input_number:
  hermes_monthly_budget_usd:
    name: Hermes Monthly Budget
    min: 0
    max: 1000
    step: 1
    unit_of_measurement: USD
    mode: box
    icon: mdi:cash-lock

utility_meter:
  hermes_cost_monthly:
    source: sensor.hermes_estimated_cost_usd
    name: Hermes Cost Monthly
    cycle: monthly
  hermes_cost_today:
    source: sensor.hermes_estimated_cost_usd
    name: Hermes Cost Today
    cycle: daily

template:
  - sensor:
      - name: "Hermes Cost 7d"
        unique_id: hermes_usage_cost_7d
        unit_of_measurement: "USD"
        device_class: monetary
        state_class: measurement
        state: >
          {% set w = state_attr('sensor.hermes_usage_summary', 'windows') %}
          {% if w and w.get('7d') %}
            {{ w['7d'].get('cost_usd', 0) | float(0) | round(6) }}
          {% else %}
            0
          {% endif %}
        availability: "{{ states('sensor.hermes_usage_summary') not in ['unknown', 'unavailable'] }}"

      - name: "Hermes Tokens 7d"
        unique_id: hermes_usage_tokens_7d
        state_class: measurement
        state: >
          {% set w = state_attr('sensor.hermes_usage_summary', 'windows') %}
          {% if w and w.get('7d') %}
            {{ w['7d'].get('total_tokens', 0) | int(0) }}
          {% else %}
            0
          {% endif %}
        availability: "{{ states('sensor.hermes_usage_summary') not in ['unknown', 'unavailable'] }}"

      - name: "Hermes Failed Session Cost"
        unique_id: hermes_usage_failed_session_cost
        unit_of_measurement: "USD"
        device_class: monetary
        state_class: measurement
        state: >
          {% set o = state_attr('sensor.hermes_usage_summary', 'overhead') %}
          {{ o.get('failed_session_cost_usd', 0) | float(0) | round(6) if o else 0 }}
        availability: "{{ states('sensor.hermes_usage_summary') not in ['unknown', 'unavailable'] }}"

      - name: "Hermes Compression Splits"
        unique_id: hermes_usage_compression_splits
        state_class: total
        state: >
          {% set o = state_attr('sensor.hermes_usage_summary', 'overhead') %}
          {{ o.get('compression_splits', 0) | int(0) if o else 0 }}
        availability: "{{ states('sensor.hermes_usage_summary') not in ['unknown', 'unavailable'] }}"

      - name: "Hermes Top Provider"
        unique_id: hermes_usage_top_provider
        state: >
          {% set rows = state_attr('sensor.hermes_usage_summary', 'by_provider') %}
          {% if rows and rows[0] %}
            {{ rows[0].get('provider', 'unknown') }}
          {% else %}
            unknown
          {% endif %}
        attributes:
          cost_usd: >
            {% set rows = state_attr('sensor.hermes_usage_summary', 'by_provider') %}
            {{ rows[0].get('cost_usd', 0) if rows and rows[0] else 0 }}
          total_tokens: >
            {% set rows = state_attr('sensor.hermes_usage_summary', 'by_provider') %}
            {{ rows[0].get('total_tokens', 0) if rows and rows[0] else 0 }}
          sessions: >
            {% set rows = state_attr('sensor.hermes_usage_summary', 'by_provider') %}
            {{ rows[0].get('sessions', 0) if rows and rows[0] else 0 }}
        availability: "{{ states('sensor.hermes_usage_summary') not in ['unknown', 'unavailable'] }}"

      - name: "Hermes Top Model"
        unique_id: hermes_usage_top_model
        state: >
          {% set rows = state_attr('sensor.hermes_usage_summary', 'by_model') %}
          {% if rows and rows[0] %}
            {{ rows[0].get('model', 'unknown') }}
          {% else %}
            unknown
          {% endif %}
        attributes:
          provider: >
            {% set rows = state_attr('sensor.hermes_usage_summary', 'by_model') %}
            {{ rows[0].get('provider', 'unknown') if rows and rows[0] else 'unknown' }}
          cost_usd: >
            {% set rows = state_attr('sensor.hermes_usage_summary', 'by_model') %}
            {{ rows[0].get('cost_usd', 0) if rows and rows[0] else 0 }}
          total_tokens: >
            {% set rows = state_attr('sensor.hermes_usage_summary', 'by_model') %}
            {{ rows[0].get('total_tokens', 0) if rows and rows[0] else 0 }}
        availability: "{{ states('sensor.hermes_usage_summary') not in ['unknown', 'unavailable'] }}"

      - name: "Hermes Budget Used Percent"
        unique_id: hermes_usage_budget_used_percent
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:gauge
        state: >
          {% set budget = states('input_number.hermes_monthly_budget_usd') | float(0) %}
          {% set spent = states('sensor.hermes_cost_monthly') | float(0) %}
          {% if budget <= 0 %}
            0
          {% else %}
            {{ ([100.0, (spent / budget * 100.0)] | min) | round(0) }}
          {% endif %}
        availability: >
          {{ states('sensor.hermes_cost_monthly') not in ['unknown', 'unavailable']
             and states('input_number.hermes_monthly_budget_usd') not in ['unknown', 'unavailable'] }}

      - name: "Hermes Projected Month End Cost"
        unique_id: hermes_usage_projected_month_end_cost
        unit_of_measurement: "USD"
        device_class: monetary
        state_class: measurement
        icon: mdi:chart-timeline-variant
        state: >
          {% set spent = states('sensor.hermes_cost_monthly') | float(0) %}
          {% set day = now().day %}
          {% set days_in_month = ((now().replace(day=28) + timedelta(days=4)).replace(day=1) - timedelta(days=1)).day %}
          {% if day < 1 %}
            {{ spent | round(2) }}
          {% else %}
            {{ (spent / day * days_in_month) | round(2) }}
          {% endif %}
        availability: "{{ states('sensor.hermes_cost_monthly') not in ['unknown', 'unavailable'] }}"

      - name: "Hermes Breakdown Markdown"
        unique_id: hermes_usage_breakdown_markdown
        state: "ok"
        attributes:
          providers: >
            {% set rows = state_attr('sensor.hermes_usage_summary', 'by_provider') or [] %}
            {% set ns = namespace(lines=['| Provider | Cost USD | Tokens | Sessions |', '|---|---:|---:|---:|']) %}
            {% for r in rows[:8] %}
              {% set ns.lines = ns.lines + ['| ' ~ (r.get('provider','?')) ~ ' | ' ~ (r.get('cost_usd',0)|float(0)|round(2)) ~ ' | ' ~ (r.get('total_tokens',0)|int(0)) ~ ' | ' ~ (r.get('sessions',0)|int(0)) ~ ' |'] %}
            {% endfor %}
            {{ ns.lines | join('\n') }}
          models: >
            {% set rows = state_attr('sensor.hermes_usage_summary', 'by_model') or [] %}
            {% set ns = namespace(lines=['| Model | Provider | Cost USD | Tokens |', '|---|---|---:|---:|']) %}
            {% for r in rows[:8] %}
              {% set ns.lines = ns.lines + ['| ' ~ (r.get('model','?')) ~ ' | ' ~ (r.get('provider','?')) ~ ' | ' ~ (r.get('cost_usd',0)|float(0)|round(2)) ~ ' | ' ~ (r.get('total_tokens',0)|int(0)) ~ ' |'] %}
            {% endfor %}
            {{ ns.lines | join('\n') }}
          tasks: >
            {% set rows = state_attr('sensor.hermes_usage_summary', 'by_task') or [] %}
            {% set ns = namespace(lines=['| Task | Cost USD | Tokens | Sessions |', '|---|---:|---:|---:|']) %}
            {% for r in rows[:8] %}
              {% set label = r.get('label') or (r.get('task') if r.get('task') else 'main') %}
              {% set ns.lines = ns.lines + ['| ' ~ label ~ ' | ' ~ (r.get('cost_usd',0)|float(0)|round(2)) ~ ' | ' ~ (r.get('total_tokens',0)|int(0)) ~ ' | ' ~ (r.get('sessions',0)|int(0)) ~ ' |'] %}
            {% endfor %}
            {{ ns.lines | join('\n') }}
        availability: "{{ states('sensor.hermes_usage_summary') not in ['unknown', 'unavailable'] }}"

# Voice helpers — copy with this package under /share/hermes/ha/packages/
# hermes_announce: speak an arbitrary line on a satellite (pairs with ha-speak webhook).
# hermes_ask: send text to the Assist conversation agent (Hermes via Extended OpenAI /
# Hermes Agent integration), then speak the reply with the chosen TTS engine.
script:
  hermes_announce:
    alias: Hermes announce
    description: Speak a message on a media_player / Voice satellite via Home Assistant TTS.
    icon: mdi:bullhorn-outline
    fields:
      message:
        name: Message
        required: true
        selector:
          text:
            multiline: true
      tts_entity:
        name: TTS entity
        required: true
        example: tts.piper
        selector:
          entity:
            domain: tts
      media_player:
        name: Media player
        required: true
        selector:
          entity:
            domain:
              - media_player
              - assist_satellite
    sequence:
      - condition: template
        value_template: "{{ message is string and message | trim | length > 0 }}"
      - service: tts.speak
        target:
          entity_id: "{{ tts_entity }}"
        data:
          media_player_entity_id: "{{ media_player }}"
          message: "{{ message }}"
    mode: queued
    max: 5

  hermes_ask:
    alias: Hermes ask (Assist)
    description: >
      Send a prompt to your Assist conversation agent (configure Hermes as the
      agent first), then speak the reply. Requires enable_openai_api and a
      conversation agent wired to Hermes (Extended OpenAI Conversation or the
      Hermes Agent custom integration).
    icon: mdi:microphone-message
    fields:
      message:
        name: Message
        required: true
        selector:
          text:
            multiline: true
      agent_id:
        name: Conversation agent ID
        description: Leave empty to use the default Assist agent.
        required: false
        selector:
          text:
      tts_entity:
        name: TTS entity
        required: true
        selector:
          entity:
            domain: tts
      media_player:
        name: Media player
        required: true
        selector:
          entity:
            domain:
              - media_player
              - assist_satellite
    sequence:
      - variables:
          ask_text: "{{ message }}"
      - condition: template
        value_template: "{{ ask_text is string and ask_text | trim | length > 0 }}"
      - service: conversation.process
        data:
          text: "{{ ask_text }}"
          agent_id: "{{ agent_id | default('', true) }}"
        response_variable: hermes_reply
      - variables:
          spoken: >
            {% set r = hermes_reply.response.speech.plain.speech
               if hermes_reply is mapping
               and hermes_reply.get('response')
               and hermes_reply.response.get('speech')
               and hermes_reply.response.speech.get('plain')
               else none %}
            {{ r if r else (hermes_reply.response.speech if hermes_reply is mapping and hermes_reply.get('response') else ask_text) }}
      - condition: template
        value_template: "{{ spoken is string and spoken | trim | length > 0 }}"
      - service: tts.speak
        target:
          entity_id: "{{ tts_entity }}"
        data:
          media_player_entity_id: "{{ media_player }}"
          message: "{{ spoken }}"
    mode: queued
    max: 3

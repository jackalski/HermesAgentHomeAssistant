# Hermes Agent usage dashboard (importable Lovelace views)
#
# Prerequisites (HACS frontend cards):
#   - Mushroom (https://github.com/piitaya/lovelace-mushroom)
#   - card-mod (https://github.com/thomasloven/lovelace-card-mod)
#   - apexcharts-card (https://github.com/RomRider/apexcharts-card)
#     Supported chart_type values: line (default), scatter, pie, donut, radialBar.
#     series.type: line | area | column. data_generator must return [timestamp_ms, value][].
#     chart_type: bar is NOT supported by apexcharts-card.
#   HACS adds Lovelace resources automatically after install.
#
# Install:
#   1. Ensure MQTT status sensors are enabled and Mosquitto is running
#   2. Install the package from /share/hermes/ha/packages/hermes_usage.yaml
#   3. Install the three HACS cards above
#   4. HA → Settings → Dashboards → Add dashboard → take control / raw editor
#   5. Paste this YAML as a new dashboard (raw config), or merge the `views:` list
#
# Source after add-on start: /share/hermes/ha/dashboards/hermes_usage.yaml
#
# If cards show as "Custom element doesn't exist", install the HACS cards and refresh.

title: Hermes Agent
views:
  - title: Overview
    path: overview
    icon: mdi:robot
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Gateway & setup
            heading_style: title
          - type: custom:mushroom-chips-card
            alignment: center
            card_mod:
              style: |
                ha-card {
                  --chip-height: 42px;
                  padding: 4px 0;
                }
            chips:
              - type: entity
                entity: binary_sensor.hermes_gateway_running
                name: Gateway
                content_info: name
                icon_color: green
              - type: entity
                entity: binary_sensor.hermes_gateway_ready
                name: Ready
                content_info: name
                icon_color: green
              - type: entity
                entity: binary_sensor.hermes_setup_complete
                name: Setup
                content_info: name
                icon_color: green
              - type: entity
                entity: binary_sensor.hermes_api_key_configured
                name: API key
                content_info: name
                icon_color: blue
              - type: entity
                entity: binary_sensor.hermes_model_configured
                name: Model
                content_info: name
                icon_color: blue
              - type: entity
                entity: binary_sensor.hermes_mcp_configured
                name: MCP
                content_info: name
                icon_color: teal
              - type: entity
                entity: binary_sensor.hermes_assist_api_enabled
                name: Assist
                content_info: name
                icon_color: purple
          - type: heading
            heading: Provider API keys
            heading_style: subtitle
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: entity
                entity: binary_sensor.hermes_provider_openrouter
                name: OpenRouter
                content_info: name
              - type: entity
                entity: binary_sensor.hermes_provider_anthropic
                name: Anthropic
                content_info: name
              - type: entity
                entity: binary_sensor.hermes_provider_openai
                name: OpenAI
                content_info: name
              - type: entity
                entity: binary_sensor.hermes_provider_google
                name: Google
                content_info: name
              - type: entity
                entity: binary_sensor.hermes_provider_ollama
                name: Ollama
                content_info: name
              - type: entity
                entity: binary_sensor.hermes_provider_minimax
                name: MiniMax
                content_info: name
              - type: entity
                entity: binary_sensor.hermes_provider_xai
                name: xAI
                content_info: name
          - type: custom:mushroom-entity-card
            entity: sensor.hermes_main_provider
            name: Provider
            icon: mdi:cloud-outline
            layout: horizontal
            fill_container: true
          - type: custom:mushroom-entity-card
            entity: sensor.hermes_main_model
            name: Model
            icon: mdi:brain
            layout: horizontal
            fill_container: true
          - type: custom:mushroom-entity-card
            entity: sensor.hermes_addon_version
            name: Add-on
            icon: mdi:package-variant
            layout: horizontal
          - type: custom:mushroom-entity-card
            entity: sensor.hermes_hermes_agent_version
            name: Hermes Agent
            icon: mdi:robot-outline
            layout: horizontal
          - type: custom:mushroom-template-card
            entity: sensor.hermes_last_error
            primary: Last error
            secondary: >-
              {% set e = states('sensor.hermes_last_error') %}
              {{ e if e not in ['unknown', 'unavailable', 'none', 'None', ''] else 'None' }}
            icon: mdi:alert-circle-outline
            icon_color: >-
              {% set e = states('sensor.hermes_last_error') %}
              {{ 'red' if e not in ['unknown', 'unavailable', 'none', 'None', ''] else 'disabled' }}
            layout: horizontal
            fill_container: true
            card_mod:
              style: |
                ha-card {
                  {% set e = states('sensor.hermes_last_error') %}
                  {% if e not in ['unknown', 'unavailable', 'none', 'None', ''] %}
                  border-left: 3px solid var(--error-color);
                  {% endif %}
                }
          - type: gauge
            entity: sensor.hermes_disk_usage_percent
            name: Disk (/config)
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 70
              red: 90
            card_mod:
              style: |
                ha-card { padding-bottom: 8px; }

  - title: Cost & tokens
    path: cost
    icon: mdi:currency-usd
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Spend & volume
            heading_style: title
          - type: custom:mushroom-template-card
            primary: >-
              ${{ states('sensor.hermes_cost_24h') | float(0) | round(4) }}
            secondary: Cost 24h
            icon: mdi:cash-clock
            icon_color: green
            layout: vertical
            tap_action:
              action: more-info
              entity: sensor.hermes_cost_24h
          - type: custom:mushroom-template-card
            primary: >-
              ${{ states('sensor.hermes_cost_7d') | float(0) | round(4) }}
            secondary: Cost 7d
            icon: mdi:calendar-week
            icon_color: green
            layout: vertical
            tap_action:
              action: more-info
              entity: sensor.hermes_cost_7d
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.hermes_tokens_24h') }}
            secondary: Tokens 24h
            icon: mdi:counter
            icon_color: blue
            layout: vertical
            tap_action:
              action: more-info
              entity: sensor.hermes_tokens_24h
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.hermes_tokens_7d') }}
            secondary: Tokens 7d
            icon: mdi:counter
            icon_color: blue
            layout: vertical
            tap_action:
              action: more-info
              entity: sensor.hermes_tokens_7d
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.hermes_sessions_24h') }}
            secondary: Sessions 24h
            icon: mdi:forum-outline
            icon_color: teal
            layout: vertical
            tap_action:
              action: more-info
              entity: sensor.hermes_sessions_24h
          - type: custom:mushroom-template-card
            primary: >-
              ${{ states('sensor.hermes_estimated_cost_usd') | float(0) | round(4) }}
            secondary: Lifetime est.
            icon: mdi:cash
            icon_color: amber
            layout: vertical
            tap_action:
              action: more-info
              entity: sensor.hermes_estimated_cost_usd
          - type: entities
            title: Lifetime totals
            show_header_toggle: false
            entities:
              - entity: sensor.hermes_estimated_cost_usd
                name: Estimated cost
              - entity: sensor.hermes_actual_cost_usd
                name: Actual cost
              - entity: sensor.hermes_total_tokens
                name: Total tokens
              - entity: sensor.hermes_input_tokens_total
                name: Input tokens
              - entity: sensor.hermes_output_tokens_total
                name: Output tokens
              - entity: sensor.hermes_api_call_count_total
                name: API calls
              - entity: sensor.hermes_sessions_total
                name: Sessions
          - type: gauge
            entity: sensor.hermes_cache_hit_ratio
            name: Cache hit ratio
            min: 0
            max: 100
            severity:
              green: 40
              yellow: 15
              red: 0
          - type: gauge
            entity: sensor.hermes_overhead_ratio
            name: Overhead ratio
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 25
              red: 50
          - type: gauge
            entity: sensor.hermes_reasoning_share
            name: Reasoning share
            min: 0
            max: 100
          - type: custom:apexcharts-card
            header:
              show: true
              title: Cost (24h)
              show_states: true
              colorize_states: true
            graph_span: 24h
            update_interval: 5m
            apex_config:
              chart:
                height: 280
              stroke:
                curve: smooth
                width: 2
              legend:
                show: true
            yaxis:
              - id: rolling
                decimals: 4
                apex_config:
                  title:
                    text: Cost 24h ($)
              - id: cumulative
                opposite: true
                decimals: 4
                apex_config:
                  title:
                    text: Lifetime ($)
            series:
              - entity: sensor.hermes_cost_24h
                name: Cost 24h
                yaxis_id: rolling
                type: area
                opacity: 0.25
                stroke_width: 2
              - entity: sensor.hermes_estimated_cost_usd
                name: Estimated total
                yaxis_id: cumulative
                type: line
                stroke_width: 2
          - type: custom:apexcharts-card
            header:
              show: true
              title: Tokens (24h)
              show_states: true
              colorize_states: true
            graph_span: 24h
            update_interval: 5m
            apex_config:
              chart:
                height: 280
              stroke:
                curve: smooth
                width: 2
            yaxis:
              - id: rolling
                decimals: 0
                apex_config:
                  title:
                    text: Tokens 24h
              - id: cumulative
                opposite: true
                decimals: 0
                apex_config:
                  title:
                    text: Lifetime
            series:
              - entity: sensor.hermes_tokens_24h
                name: Tokens 24h
                yaxis_id: rolling
                type: area
                opacity: 0.25
              - entity: sensor.hermes_total_tokens
                name: Total tokens
                yaxis_id: cumulative
                type: line
          - type: custom:apexcharts-card
            header:
              show: true
              title: Cost & tokens (7d)
              show_states: true
              colorize_states: true
            graph_span: 7d
            update_interval: 15m
            apex_config:
              chart:
                height: 260
              stroke:
                curve: smooth
                width: 2
            yaxis:
              - id: cost
                decimals: 4
              - id: tokens
                opposite: true
                decimals: 0
            series:
              - entity: sensor.hermes_cost_7d
                name: Cost 7d
                yaxis_id: cost
                type: area
                opacity: 0.2
              - entity: sensor.hermes_tokens_7d
                name: Tokens 7d
                yaxis_id: tokens
                type: line
          - type: custom:apexcharts-card
            header:
              show: true
              title: Token composition (lifetime)
              show_states: true
              colorize_states: true
            graph_span: 24h
            stacked: true
            update_interval: 5m
            apex_config:
              chart:
                height: 260
              stroke:
                width: 1
            series:
              - entity: sensor.hermes_input_tokens_total
                name: Input
                type: area
                opacity: 0.55
              - entity: sensor.hermes_output_tokens_total
                name: Output
                type: area
                opacity: 0.55
              - entity: sensor.hermes_cache_read_tokens_total
                name: Cache read
                type: area
                opacity: 0.55
              - entity: sensor.hermes_cache_write_tokens_total
                name: Cache write
                type: area
                opacity: 0.55
              - entity: sensor.hermes_reasoning_tokens_total
                name: Reasoning
                type: area
                opacity: 0.55

  - title: Breakdown
    path: breakdown
    icon: mdi:chart-bar
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: By provider / model / task
            heading_style: title
          - type: custom:mushroom-template-card
            entity: sensor.hermes_top_provider
            primary: >-
              {{ states('sensor.hermes_top_provider') }}
            secondary: >-
              Top provider · ${{ state_attr('sensor.hermes_top_provider', 'cost_usd') | float(0) | round(4) }}
              · {{ state_attr('sensor.hermes_top_provider', 'total_tokens') | default(0) }} tok
            icon: mdi:cloud
            icon_color: blue
            layout: horizontal
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.hermes_top_model
            primary: >-
              {{ states('sensor.hermes_top_model') }}
            secondary: >-
              Top model · ${{ state_attr('sensor.hermes_top_model', 'cost_usd') | float(0) | round(4) }}
              · {{ state_attr('sensor.hermes_top_model', 'total_tokens') | default(0) }} tok
            icon: mdi:cube-outline
            icon_color: purple
            layout: horizontal
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.hermes_usage_summary
            name: Usage summary
            icon: mdi:chart-box-outline
            layout: horizontal
          - type: custom:apexcharts-card
            header:
              show: true
              title: Cost by provider (rank left to right)
              show_states: false
            graph_span: 8h
            span:
              end: hour
            update_interval: 5m
            apex_config:
              chart:
                height: 280
                toolbar:
                  show: false
              plotOptions:
                bar:
                  columnWidth: "70%"
                  borderRadius: 4
              dataLabels:
                enabled: true
              xaxis:
                labels:
                  show: false
              legend:
                show: false
            series:
              - entity: sensor.hermes_usage_summary
                type: column
                name: Cost USD
                float_precision: 4
                unit: USD
                show:
                  datalabels: true
                  in_header: false
                  legend_value: false
                data_generator: |
                  const rows = (entity.attributes.by_provider || []).slice(0, 8);
                  const step = 3600 * 1000;
                  const t0 = end.getTime() - Math.max(rows.length, 1) * step;
                  return rows.map((r, i) => [t0 + i * step, Number(r.cost_usd) || 0]);
          - type: custom:apexcharts-card
            header:
              show: true
              title: Cost by model (rank left to right)
              show_states: false
            graph_span: 8h
            span:
              end: hour
            update_interval: 5m
            apex_config:
              chart:
                height: 280
                toolbar:
                  show: false
              plotOptions:
                bar:
                  columnWidth: "70%"
                  borderRadius: 4
              dataLabels:
                enabled: true
              xaxis:
                labels:
                  show: false
              legend:
                show: false
            series:
              - entity: sensor.hermes_usage_summary
                type: column
                name: Cost USD
                float_precision: 4
                unit: USD
                show:
                  datalabels: true
                  in_header: false
                  legend_value: false
                data_generator: |
                  const rows = (entity.attributes.by_model || []).slice(0, 8);
                  const step = 3600 * 1000;
                  const t0 = end.getTime() - Math.max(rows.length, 1) * step;
                  return rows.map((r, i) => [t0 + i * step, Number(r.cost_usd) || 0]);
          - type: custom:apexcharts-card
            header:
              show: true
              title: Cost by task (rank left to right)
              show_states: false
            graph_span: 8h
            span:
              end: hour
            update_interval: 5m
            apex_config:
              chart:
                height: 280
                toolbar:
                  show: false
              plotOptions:
                bar:
                  columnWidth: "70%"
                  borderRadius: 4
              dataLabels:
                enabled: true
              xaxis:
                labels:
                  show: false
              legend:
                show: false
            series:
              - entity: sensor.hermes_usage_summary
                type: column
                name: Cost USD
                float_precision: 4
                unit: USD
                show:
                  datalabels: true
                  in_header: false
                  legend_value: false
                data_generator: |
                  const rows = (entity.attributes.by_task || []).slice(0, 8);
                  const step = 3600 * 1000;
                  const t0 = end.getTime() - Math.max(rows.length, 1) * step;
                  return rows.map((r, i) => [t0 + i * step, Number(r.cost_usd) || 0]);
          - type: markdown
            title: Providers (table)
            content: >
              {{ state_attr('sensor.hermes_breakdown_markdown', 'providers')
                 or '_No provider breakdown yet — wait for the next status poll._' }}
            card_mod:
              style: |
                ha-card {
                  overflow-x: auto;
                }
                ha-markdown {
                  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                  font-size: 0.85rem;
                }
          - type: markdown
            title: Models (table)
            content: >
              {{ state_attr('sensor.hermes_breakdown_markdown', 'models')
                 or '_No model breakdown yet._' }}
            card_mod:
              style: |
                ha-card { overflow-x: auto; }
                ha-markdown {
                  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                  font-size: 0.85rem;
                }
          - type: markdown
            title: Tasks (table)
            content: >
              {{ state_attr('sensor.hermes_breakdown_markdown', 'tasks')
                 or '_No task breakdown yet (requires session_model_usage in state.db)._' }}
            card_mod:
              style: |
                ha-card { overflow-x: auto; }
                ha-markdown {
                  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                  font-size: 0.85rem;
                }
          - type: markdown
            content: |
              **Notes**
              - Breakdowns come from `sensor.hermes_usage_summary` attributes (`by_provider`, `by_model`, `by_task`).
              - Column charts rank top entries left→right by cost; names are in the tables below.
              - Top 10 rows are kept; the rest roll into `other`.
              - Auxiliary tasks (compression, title generation, …) appear under **Tasks**.

  - title: Overhead
    path: overhead
    icon: mdi:alert-decagram-outline
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Overhead proxies
            heading_style: title
          - type: custom:mushroom-template-card
            primary: >-
              ${{ states('sensor.hermes_overhead_cost_usd') | float(0) | round(4) }}
            secondary: Overhead cost
            icon: mdi:alert-decagram
            icon_color: orange
            layout: vertical
            tap_action:
              action: more-info
              entity: sensor.hermes_overhead_cost_usd
          - type: custom:mushroom-template-card
            primary: >-
              ${{ states('sensor.hermes_compression_cost_usd') | float(0) | round(4) }}
            secondary: Compression
            icon: mdi:arrow-collapse-vertical
            icon_color: amber
            layout: vertical
            tap_action:
              action: more-info
              entity: sensor.hermes_compression_cost_usd
          - type: custom:mushroom-template-card
            primary: >-
              ${{ states('sensor.hermes_aux_cost_usd') | float(0) | round(4) }}
            secondary: Auxiliary
            icon: mdi:cog-transfer-outline
            icon_color: blue
            layout: vertical
            tap_action:
              action: more-info
              entity: sensor.hermes_aux_cost_usd
          - type: custom:mushroom-template-card
            primary: >-
              ${{ states('sensor.hermes_failed_session_cost') | float(0) | round(4) }}
            secondary: Failed sessions
            icon: mdi:close-octagon-outline
            icon_color: red
            layout: vertical
            tap_action:
              action: more-info
              entity: sensor.hermes_failed_session_cost
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.hermes_compression_splits') }}
            secondary: Compression splits
            icon: mdi:call-split
            icon_color: grey
            layout: vertical
            tap_action:
              action: more-info
              entity: sensor.hermes_compression_splits
          - type: custom:mushroom-entity-card
            entity: sensor.hermes_cache_write_tokens_total
            name: Cache write tokens
            icon: mdi:database-import-outline
            layout: horizontal
          - type: custom:mushroom-entity-card
            entity: sensor.hermes_reasoning_tokens_total
            name: Reasoning tokens
            icon: mdi:head-cog-outline
            layout: horizontal
          - type: gauge
            entity: sensor.hermes_overhead_ratio
            name: Overhead ratio
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 25
              red: 50
          - type: custom:apexcharts-card
            header:
              show: true
              title: Overhead composition
              show_states: true
              colorize_states: true
            chart_type: donut
            update_interval: 5m
            apex_config:
              chart:
                height: 300
              legend:
                position: bottom
            series:
              - entity: sensor.hermes_compression_cost_usd
                name: Compression
                float_precision: 4
                unit: USD
              - entity: sensor.hermes_aux_cost_usd
                name: Auxiliary
                float_precision: 4
                unit: USD
              - entity: sensor.hermes_failed_session_cost
                name: Failed sessions
                float_precision: 4
                unit: USD
          - type: markdown
            title: How these are calculated
            content: |
              These are **proxies**, not absolute waste:

              - **Aux cost / tokens** — `session_model_usage` rows where `task ≠ main` (compression, title, vision, …)
              - **Compression cost** — task `compression` only
              - **Compression splits** — sessions with a `parent_session_id` (legacy non-in-place compaction)
              - **Overhead tokens** ≈ aux tokens + reasoning tokens + cache write tokens
              - **Overhead cost** ≈ aux cost + session cost share attributed to reasoning + cache write
              - **Overhead ratio** = overhead cost ÷ total cost
              - **Cache hit ratio** = cache read ÷ (input + cache read)
              - **Reasoning share** = reasoning ÷ (output + reasoning)
              - **Failed-session cost** — sessions whose `end_reason` looks like error/timeout/crash/…

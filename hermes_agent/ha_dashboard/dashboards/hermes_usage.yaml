# Hermes Agent usage dashboard (importable Lovelace views)
#
# Two views: Operations / Analysis
#
# Prerequisites (HACS frontend cards):
#   - Mushroom (https://github.com/piitaya/lovelace-mushroom)
#   - card-mod (https://github.com/thomasloven/lovelace-card-mod)
#   - apexcharts-card (https://github.com/RomRider/apexcharts-card)
#     Supported chart_type values: line (default), scatter, pie, donut, radialBar.
#     series.type: line | area | column. data_generator must return [timestamp_ms, value][].
#     chart_type: bar is NOT supported by apexcharts-card.
#   HACS adds Lovelace resources automatically after install.
#
# Install:
#   1. Ensure MQTT status sensors are enabled and Mosquitto is running
#   2. Install the package from /share/hermes/ha/packages/hermes_usage.yaml
#   3. Install the three HACS cards above
#   4. Optional: import blueprints from /share/hermes/ha/blueprints/automation/
#   5. HA → Settings → Dashboards → Add dashboard → take control / raw editor
#   6. Paste this YAML as a new dashboard (raw config), or merge the `views:` list
#      Tip: copy from the add-on Ingress landing page (Home Assistant dashboard section)
#      or fetch ./ha/dashboards/hermes_usage.yaml via Ingress.
#
# Source after add-on start: /share/hermes/ha/dashboards/hermes_usage.yaml
#
# If cards show as "Custom element doesn't exist", install the HACS cards and refresh.
# Control buttons/selects appear only when mqtt_settings.enable_control_entities is ON.

title: Hermes Agent
views:
  - title: Operations
    path: operations
    icon: mdi:heart-pulse
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Health
            heading_style: title
          - type: vertical-stack
            cards:
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    grid_options:
                      columns: 3
                    primary: >-
                      {% if is_state('binary_sensor.hermes_gateway_running',
                      'on')
                           and is_state('binary_sensor.hermes_gateway_ready', 'on')
                           and is_state('binary_sensor.hermes_setup_complete', 'on') %}
                        All systems ready
                      {% elif is_state('binary_sensor.hermes_gateway_running',
                      'off') %}
                        Gateway down
                      {% elif is_state('binary_sensor.hermes_setup_complete',
                      'off') %}
                        Setup incomplete
                      {% else %}
                        Degraded
                      {% endif %}
                    secondary: >-
                      {% set u = states('sensor.hermes_updated_at') %} {% if u
                      in ['unknown', 'unavailable', ''] %}
                        {% set u = state_attr('sensor.hermes_usage_summary', 'updated_at') %}
                      {% endif %} Updated {{ relative_time(as_datetime(u)) if u
                      not in [none, 'unknown', 'unavailable', ''] else '—' }} ·
                      Assist {{ 'up' if
                      is_state('binary_sensor.hermes_assist_api_enabled', 'on')
                      else 'off' }}
                    icon: >-
                      {% if is_state('binary_sensor.hermes_gateway_running',
                      'on')
                           and is_state('binary_sensor.hermes_gateway_ready', 'on')
                           and is_state('binary_sensor.hermes_setup_complete', 'on') %}
                        mdi:check-decagram
                      {% elif is_state('binary_sensor.hermes_gateway_running',
                      'off') %}
                        mdi:alert-octagon
                      {% else %}
                        mdi:alert
                      {% endif %}
                    color: >-
                      {% if is_state('binary_sensor.hermes_gateway_running',
                      'on')
                           and is_state('binary_sensor.hermes_gateway_ready', 'on')
                           and is_state('binary_sensor.hermes_setup_complete', 'on') %}
                        green
                      {% elif is_state('binary_sensor.hermes_gateway_running',
                      'off') %}
                        red
                      {% else %}
                        amber
                      {% endif %}
                    features_position: bottom
                    card_mod:
                      style: |
                        ha-card {
                          border-radius: 18px;
                          border-top: 1px solid rgba(148, 163, 184, 0.12);
                          border-right: 1px solid rgba(148, 163, 184, 0.12);
                          border-bottom: 1px solid rgba(148, 163, 184, 0.12);
                          background: linear-gradient(135deg, rgba(5, 150, 105, 0.11), rgba(255,255,255,0.015)), var(--ha-card-background, #151821);
                          box-shadow: 0 12px 32px rgba(0,0,0,0.20);
                          border-left: 3px solid
                            {% if is_state('binary_sensor.hermes_gateway_running', 'on')
                                 and is_state('binary_sensor.hermes_gateway_ready', 'on')
                                 and is_state('binary_sensor.hermes_setup_complete', 'on') %}
                              #059669
                            {% elif is_state('binary_sensor.hermes_gateway_running', 'off') %}
                              #dc2626
                            {% else %}
                              #d97706
                            {% endif %};
                        }
                  - type: custom:mushroom-chips-card
                    grid_options:
                      columns: 1
                    alignment: center
                    chips:
                      - type: entity
                        entity: binary_sensor.hermes_gateway_running
                        name: Gateway
                        content_info: name
                        icon_color: green
                      - type: entity
                        entity: binary_sensor.hermes_gateway_ready
                        name: Ready
                        content_info: name
                        icon_color: green
                      - type: entity
                        entity: binary_sensor.hermes_setup_complete
                        name: Setup
                        content_info: name
                        icon_color: green
                      - type: entity
                        entity: binary_sensor.hermes_api_key_configured
                        name: API key
                        content_info: name
                        icon_color: blue
                      - type: entity
                        entity: binary_sensor.hermes_model_configured
                        name: Model
                        content_info: name
                        icon_color: blue
                      - type: entity
                        entity: binary_sensor.hermes_mcp_configured
                        name: MCP
                        content_info: name
                        icon_color: teal
                      - type: entity
                        entity: binary_sensor.hermes_assist_api_enabled
                        name: Assist
                        content_info: name
                        icon_color: purple
              - type: conditional
                grid_options:
                  columns: 48
                conditions:
                  - condition: state
                    entity: sensor.hermes_last_error
                    state_not:
                      - unknown
                      - unavailable
                      - none
                      - None
                      - ""
                card:
                  type: custom:mushroom-template-card
                  entity: sensor.hermes_last_error
                  primary: Last error
                  secondary: >-
                    {{ states('sensor.hermes_last_error')[:120] }}{% if
                    states('sensor.hermes_last_error')|length > 120 %}…{% endif
                    %}
                  icon: mdi:alert-circle-outline
                  tap_action:
                    action: more-info
                  color: red
                  features_position: bottom
                  card_mod:
                    style: |
                      ha-card {
                        border-radius: 18px;
                        border-top: 1px solid rgba(239, 68, 68, 0.18);
                        border-right: 1px solid rgba(239, 68, 68, 0.18);
                        border-bottom: 1px solid rgba(239, 68, 68, 0.18);
                        background: linear-gradient(135deg, rgba(220, 38, 38, 0.13), rgba(255,255,255,0.01)), var(--ha-card-background, #151821);
                        box-shadow: 0 12px 32px rgba(0,0,0,0.20);
                        border-left: 3px solid #dc2626;
                      }
            grid_options:
              columns: full
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Runtime
            heading_style: title
          - type: vertical-stack
            cards:
              - square: false
                type: grid
                cards:
                  - type: custom:mushroom-entity-card
                    entity: sensor.hermes_main_provider
                    name: Provider
                    icon: mdi:cloud-outline
                    layout: horizontal
                    fill_container: false
                    primary_info: name
                    secondary_info: state
                    card_mod:
                      style: |
                        ha-card {
                          border-radius: 18px;
                          border: 1px solid rgba(148, 163, 184, 0.12);
                          background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008)), var(--ha-card-background, #151821);
                          box-shadow: 0 10px 28px rgba(0,0,0,0.18);
                          overflow: hidden;
                          transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
                        }
                        ha-card:hover {
                          transform: translateY(-2px);
                          border-color: rgba(59, 130, 246, 0.30);
                          box-shadow: 0 14px 34px rgba(0,0,0,0.24);
                        }
                  - type: custom:mushroom-entity-card
                    entity: sensor.hermes_main_model
                    name: Model
                    icon: mdi:brain
                    layout: horizontal
                    fill_container: false
                    card_mod:
                      style: |
                        ha-card {
                          border-radius: 18px;
                          border: 1px solid rgba(148, 163, 184, 0.12);
                          background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008)), var(--ha-card-background, #151821);
                          box-shadow: 0 10px 28px rgba(0,0,0,0.18);
                          overflow: hidden;
                          transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
                        }
                        ha-card:hover {
                          transform: translateY(-2px);
                          border-color: rgba(59, 130, 246, 0.30);
                          box-shadow: 0 14px 34px rgba(0,0,0,0.24);
                        }
                  - type: custom:mushroom-entity-card
                    entity: sensor.hermes_access_mode
                    name: Access
                    icon: mdi:lan
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card {
                          border-radius: 18px;
                          border: 1px solid rgba(148, 163, 184, 0.12);
                          background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008)), var(--ha-card-background, #151821);
                          box-shadow: 0 10px 28px rgba(0,0,0,0.18);
                          overflow: hidden;
                          transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
                        }
                        ha-card:hover {
                          transform: translateY(-2px);
                          border-color: rgba(59, 130, 246, 0.30);
                          box-shadow: 0 14px 34px rgba(0,0,0,0.24);
                        }
                  - type: custom:mushroom-entity-card
                    entity: sensor.hermes_gateway_mode
                    name: Gateway
                    icon: mdi:transit-connection-variant
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card {
                          border-radius: 18px;
                          border: 1px solid rgba(148, 163, 184, 0.12);
                          background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008)), var(--ha-card-background, #151821);
                          box-shadow: 0 10px 28px rgba(0,0,0,0.18);
                          overflow: hidden;
                          transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
                        }
                        ha-card:hover {
                          transform: translateY(-2px);
                          border-color: rgba(59, 130, 246, 0.30);
                          box-shadow: 0 14px 34px rgba(0,0,0,0.24);
                        }
                  - type: custom:mushroom-entity-card
                    entity: sensor.hermes_setup_profile
                    name: Profile
                    icon: mdi:account-cog-outline
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card {
                          border-radius: 18px;
                          border: 1px solid rgba(148, 163, 184, 0.12);
                          background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008)), var(--ha-card-background, #151821);
                          box-shadow: 0 10px 28px rgba(0,0,0,0.18);
                          overflow: hidden;
                          transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
                        }
                        ha-card:hover {
                          transform: translateY(-2px);
                          border-color: rgba(59, 130, 246, 0.30);
                          box-shadow: 0 14px 34px rgba(0,0,0,0.24);
                        }
                  - type: custom:mushroom-entity-card
                    entity: sensor.hermes_addon_version
                    name: Add-on
                    icon: mdi:package-variant
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card {
                          border-radius: 18px;
                          border: 1px solid rgba(148, 163, 184, 0.12);
                          background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008)), var(--ha-card-background, #151821);
                          box-shadow: 0 10px 28px rgba(0,0,0,0.18);
                          overflow: hidden;
                          transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
                        }
                        ha-card:hover {
                          transform: translateY(-2px);
                          border-color: rgba(59, 130, 246, 0.30);
                          box-shadow: 0 14px 34px rgba(0,0,0,0.24);
                        }
                  - type: custom:mushroom-entity-card
                    entity: sensor.hermes_hermes_agent_version
                    name: Hermes
                    icon: mdi:robot-outline
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card {
                          border-radius: 18px;
                          border: 1px solid rgba(148, 163, 184, 0.12);
                          background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008)), var(--ha-card-background, #151821);
                          box-shadow: 0 10px 28px rgba(0,0,0,0.18);
                          overflow: hidden;
                          transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
                        }
                        ha-card:hover {
                          transform: translateY(-2px);
                          border-color: rgba(59, 130, 246, 0.30);
                          box-shadow: 0 14px 34px rgba(0,0,0,0.24);
                        }
                  - type: custom:mushroom-entity-card
                    entity: sensor.hermes_auxiliary_title_model
                    name: Aux model
                    icon: mdi:text-box-outline
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card {
                          border-radius: 18px;
                          border: 1px solid rgba(148, 163, 184, 0.12);
                          background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008)), var(--ha-card-background, #151821);
                          box-shadow: 0 10px 28px rgba(0,0,0,0.18);
                          overflow: hidden;
                          transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
                        }
                        ha-card:hover {
                          transform: translateY(-2px);
                          border-color: rgba(59, 130, 246, 0.30);
                          box-shadow: 0 14px 34px rgba(0,0,0,0.24);
                        }
                columns: 3
              - type: custom:mushroom-chips-card
                alignment: center
                chips:
                  - type: entity
                    entity: binary_sensor.hermes_provider_openrouter
                    name: OpenRouter
                    content_info: name
                  - type: entity
                    entity: binary_sensor.hermes_provider_anthropic
                    name: Anthropic
                    content_info: name
                  - type: entity
                    entity: binary_sensor.hermes_provider_openai
                    name: OpenAI
                    content_info: name
                  - type: entity
                    entity: binary_sensor.hermes_provider_google
                    name: Google
                    content_info: name
                  - type: entity
                    entity: binary_sensor.hermes_provider_ollama
                    name: Ollama
                    content_info: name
                  - type: entity
                    entity: binary_sensor.hermes_provider_minimax
                    name: MiniMax
                    content_info: name
                  - type: entity
                    entity: binary_sensor.hermes_provider_xai
                    name: xAI
                    content_info: name
              - type: markdown
                content: >
                  **Assist / voice** — set `enable_openai_api: true`, then point
                  [Extended OpenAI
                  Conversation](https://github.com/jekalmin/extended_openai_conversation)
                  at `http://<LAN-IP>:8642/v1` with the gateway token. Wake word
                  and mic live on Voice PE / ESPHome satellites — not in this
                  add-on container. For spoken announcements from Hermes, use the
                  **Hermes voice announce** blueprint with
                  `outbound_events` or the `ha-speak` webhook route.
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 18px;
                      border: 1px solid rgba(148, 163, 184, 0.12);
                      background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008)), var(--ha-card-background, #151821);
                      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
                      overflow: hidden;
                      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
                    }
                    ha-card:hover {
                      transform: translateY(-2px);
                      border-color: rgba(59, 130, 246, 0.30);
                      box-shadow: 0 14px 34px rgba(0,0,0,0.24);
                    }
              - type: heading
                heading: Voice
                heading_style: subtitle
              - square: false
                type: grid
                columns: 2
                cards:
                  - type: custom:mushroom-entity-card
                    entity: sensor.hermes_stt_provider
                    name: STT
                    icon: mdi:microphone
                    layout: horizontal
                    primary_info: name
                    secondary_info: state
                  - type: custom:mushroom-entity-card
                    entity: sensor.hermes_tts_provider
                    name: TTS
                    icon: mdi:speaker-message
                    layout: horizontal
                    primary_info: name
                    secondary_info: state
                  - type: custom:mushroom-entity-card
                    entity: sensor.hermes_max_turns
                    name: Max turns
                    icon: mdi:counter
                    layout: horizontal
                    primary_info: name
                    secondary_info: state
                  - type: custom:mushroom-entity-card
                    entity: binary_sensor.hermes_outbound_events_enabled
                    name: Outbound events
                    icon: mdi:webhook
                    layout: horizontal
                    primary_info: name
                    secondary_info: state
            grid_options:
              columns: full
              rows: auto
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Spending
            heading_style: title
          - type: horizontal-stack
            cards:
              - type: horizontal-stack
                cards:
                  - type: vertical-stack
                    cards:
                      - type: custom:mushroom-template-card
                        primary: >-
                          ${{ states('sensor.hermes_cost_24h') | float(0) |
                          round(2) }}
                        secondary: Cost 24h
                        icon: mdi:cash-clock
                        icon_color: green
                        layout: vertical
                        tap_action:
                          action: more-info
                          entity: sensor.hermes_cost_24h
                        card_mod:
                          style: |
                            ha-card {
                              border-radius: 18px;
                              border: 1px solid rgba(148, 163, 184, 0.12);
                              background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008)), var(--ha-card-background, #151821);
                              box-shadow: 0 10px 28px rgba(0,0,0,0.18);
                              overflow: hidden;
                              transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
                            }
                            ha-card:hover {
                              transform: translateY(-2px);
                              border-color: rgba(59, 130, 246, 0.30);
                              box-shadow: 0 14px 34px rgba(0,0,0,0.24);
                            }
                      - type: custom:mushroom-template-card
                        primary: >-
                          {% set s = states('sensor.hermes_sessions_24h') |
                          float(0) %} {% set c =
                          states('sensor.hermes_cost_24h') | float(0) %} ${{ (c
                          / s) | round(2) if s > 0 else 0 }}
                        secondary: Cost / session
                        icon: mdi:cash-multiple
                        icon_color: green
                        layout: vertical
                        card_mod:
                          style: |
                            ha-card {
                              border-radius: 18px;
                              border: 1px solid rgba(148, 163, 184, 0.12);
                              background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008)), var(--ha-card-background, #151821);
                              box-shadow: 0 10px 28px rgba(0,0,0,0.18);
                              overflow: hidden;
                              transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
                            }
                            ha-card:hover {
                              transform: translateY(-2px);
                              border-color: rgba(59, 130, 246, 0.30);
                              box-shadow: 0 14px 34px rgba(0,0,0,0.24);
                            }
                      - type: custom:mushroom-template-card
                        primary: >-
                          {% set p =
                          states('sensor.hermes_projected_month_end_cost') %} {%
                          if p in ['unknown', 'unavailable'] %}— {% else %}${{ p
                          | float(0) | round(2) }}{% endif %}
                        secondary: >-
                          Projected EOM (${{
                          states('input_number.hermes_monthly_budget_usd') |
                          float(0) | round(0) | int }})
                        icon: mdi:chart-timeline-variant
                        icon_color: blue
                        layout: vertical
                        tap_action:
                          action: more-info
                          entity: input_number.hermes_monthly_budget_usd
                        card_mod:
                          style: |
                            ha-card {
                              border-radius: 18px;
                              border: 1px solid rgba(148, 163, 184, 0.12);
                              background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008)), var(--ha-card-background, #151821);
                              box-shadow: 0 10px 28px rgba(0,0,0,0.18);
                              overflow: hidden;
                              transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
                            }
                            ha-card:hover {
                              transform: translateY(-2px);
                              border-color: rgba(59, 130, 246, 0.30);
                              box-shadow: 0 14px 34px rgba(0,0,0,0.24);
                            }
                  - type: vertical-stack
                    cards:
                      - type: custom:mushroom-template-card
                        primary: >-
                          {% set n = states('sensor.hermes_tokens_24h') |
                          float(0) %} {% if n >= 1000000 %}{{ (n / 1000000) |
                          round(1) }}M {% elif n >= 1000 %}{{ (n / 1000) |
                          round(1) }}k {% else %}{{ n | int }}{% endif %}
                        secondary: Tokens 24h
                        icon: mdi:counter
                        icon_color: blue
                        layout: vertical
                        tap_action:
                          action: more-info
                          entity: sensor.hermes_tokens_24h
                        card_mod:
                          style: |
                            ha-card {
                              border-radius: 18px;
                              border: 1px solid rgba(148, 163, 184, 0.12);
                              background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008)), var(--ha-card-background, #151821);
                              box-shadow: 0 10px 28px rgba(0,0,0,0.18);
                              overflow: hidden;
                              transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
                            }
                            ha-card:hover {
                              transform: translateY(-2px);
                              border-color: rgba(59, 130, 246, 0.30);
                              box-shadow: 0 14px 34px rgba(0,0,0,0.24);
                            }
                      - type: custom:mushroom-template-card
                        grid_options:
                          columns: 9
                        primary: >-
                          {% set t = states('sensor.hermes_cost_today') %} {% if
                          t in ['unknown', 'unavailable'] %}— {% else %}${{ t |
                          float(0) | round(2) }}{% endif %}
                        secondary: Spent today
                        icon: mdi:calendar-today
                        icon_color: green
                        layout: vertical
                        tap_action:
                          action: more-info
                          entity: sensor.hermes_cost_today
                        card_mod:
                          style: |
                            ha-card {
                              border-radius: 18px;
                              border: 1px solid rgba(148, 163, 184, 0.12);
                              background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.008)), var(--ha-card-background, #151821);
                              box-shadow: 0 10px 28px rgba(0,0,0,0.18);
                              overflow: hidden;
                              transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
                            }
                            ha-card:hover {
                              transform: translateY(-2px);
                              border-color: rgba(59, 130, 246, 0.30);
                              box-shadow: 0 14px 34px rgba(0,0,0,0.24);
                            }
                      - type: custom:mushroom-template-card
                        primary: >-
                          {% set d = states('sensor.hermes_disk_usage_percent')
                          %} {% if d in ['unknown', 'unavailable'] %}—% {% else
                          %}{{ d | float(0) | round(0) | int }}%{% endif %}
                        secondary: Disk /config
                        icon: mdi:harddisk
                        icon_color: >-
                          {% set d = states('sensor.hermes_disk_usage_percent')
                          | float(0) %} {{ 'red' if d >= 90 else 'amber' if d >=
                          70 else 'teal' }}
                        layout: vertical
                        tap_action:
                          action: more-info
                          entity: sensor.hermes_disk_usage_percent
                        card_mod:
                          style: |
                            ha-card {

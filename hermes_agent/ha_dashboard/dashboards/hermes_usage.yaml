# Hermes Agent usage dashboard (importable Lovelace views)
#
# Two multi-column narrative views:
#   - Operations: health, today's spend / budget, controls, configuration
#   - Analysis: where money went, efficiency, waste, reference tables
#
# Prerequisites (HACS frontend cards):
#   - Mushroom (https://github.com/piitaya/lovelace-mushroom)
#   - card-mod (https://github.com/thomasloven/lovelace-card-mod)
#   - apexcharts-card (https://github.com/RomRider/apexcharts-card)
#     Supported chart_type values: line (default), scatter, pie, donut, radialBar.
#     series.type: line | area | column. data_generator must return [timestamp_ms, value][].
#     chart_type: bar is NOT supported by apexcharts-card.
#   HACS adds Lovelace resources automatically after install.
#
# Install:
#   1. Ensure MQTT status sensors are enabled and Mosquitto is running
#   2. Install the package from /share/hermes/ha/packages/hermes_usage.yaml
#   3. Install the three HACS cards above
#   4. Optional: import blueprints from /share/hermes/ha/blueprints/automation/
#   5. HA → Settings → Dashboards → Add dashboard → take control / raw editor
#   6. Paste this YAML as a new dashboard (raw config), or merge the `views:` list
#      Tip: copy from the add-on Ingress landing page (Home Assistant dashboard section)
#      or fetch ./ha/dashboards/hermes_usage.yaml via Ingress.
#
# Source after add-on start: /share/hermes/ha/dashboards/hermes_usage.yaml
#
# If cards show as "Custom element doesn't exist", install the HACS cards and refresh.
# Control buttons/selects appear only when mqtt_settings.enable_control_entities is ON.

title: Hermes Agent
views:
  - title: Operations
    path: operations
    icon: mdi:heart-pulse
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Is Hermes healthy?
            heading_style: title
          - type: custom:mushroom-template-card
            primary: >-
              {% if is_state('binary_sensor.hermes_gateway_running', 'on')
                   and is_state('binary_sensor.hermes_gateway_ready', 'on')
                   and is_state('binary_sensor.hermes_setup_complete', 'on') %}
                All systems ready
              {% elif is_state('binary_sensor.hermes_gateway_running', 'off') %}
                Gateway down
              {% elif is_state('binary_sensor.hermes_setup_complete', 'off') %}
                Setup incomplete
              {% else %}
                Degraded
              {% endif %}
            secondary: >-
              Updated {{ relative_time(states('sensor.hermes_updated_at')) if states('sensor.hermes_updated_at') not in ['unknown', 'unavailable', ''] else '—' }}
              · Assist {{ 'up' if is_state('binary_sensor.hermes_assist_api_enabled', 'on') else 'off' }}
            icon: >-
              {% if is_state('binary_sensor.hermes_gateway_running', 'on')
                   and is_state('binary_sensor.hermes_gateway_ready', 'on')
                   and is_state('binary_sensor.hermes_setup_complete', 'on') %}
                mdi:check-decagram
              {% elif is_state('binary_sensor.hermes_gateway_running', 'off') %}
                mdi:alert-octagon
              {% else %}
                mdi:alert
              {% endif %}
            icon_color: >-
              {% if is_state('binary_sensor.hermes_gateway_running', 'on')
                   and is_state('binary_sensor.hermes_gateway_ready', 'on')
                   and is_state('binary_sensor.hermes_setup_complete', 'on') %}
                green
              {% elif is_state('binary_sensor.hermes_gateway_running', 'off') %}
                red
              {% else %}
                amber
              {% endif %}
            layout: horizontal
            fill_container: true
            card_mod:
              style: |
                ha-card {
                  border-radius: 12px;
                  border: 1px solid var(--divider-color);
                  border-left: 3px solid
                    {% if is_state('binary_sensor.hermes_gateway_running', 'on')
                         and is_state('binary_sensor.hermes_gateway_ready', 'on')
                         and is_state('binary_sensor.hermes_setup_complete', 'on') %}
                      #059669
                    {% elif is_state('binary_sensor.hermes_gateway_running', 'off') %}
                      #dc2626
                    {% else %}
                      #d97706
                    {% endif %};
                }
          - type: custom:mushroom-chips-card
            alignment: center
            card_mod:
              style: |
                ha-card {
                  --chip-height: 42px;
                  padding: 4px 0;
                  border-radius: 12px;
                  border: 1px solid var(--divider-color);
                }
            chips:
              - type: entity
                entity: binary_sensor.hermes_gateway_running
                name: Gateway
                content_info: name
                icon_color: green
              - type: entity
                entity: binary_sensor.hermes_gateway_ready
                name: Ready
                content_info: name
                icon_color: green
              - type: entity
                entity: binary_sensor.hermes_setup_complete
                name: Setup
                content_info: name
                icon_color: green
              - type: entity
                entity: binary_sensor.hermes_api_key_configured
                name: API key
                content_info: name
                icon_color: blue
              - type: entity
                entity: binary_sensor.hermes_model_configured
                name: Model
                content_info: name
                icon_color: blue
              - type: entity
                entity: binary_sensor.hermes_mcp_configured
                name: MCP
                content_info: name
                icon_color: teal
              - type: entity
                entity: binary_sensor.hermes_assist_api_enabled
                name: Assist
                content_info: name
                icon_color: purple
          - type: conditional
            conditions:
              - condition: template
                value_template: >-
                  {% set e = states('sensor.hermes_last_error') %}
                  {{ e not in ['unknown', 'unavailable', 'none', 'None', ''] }}
            card:
              type: custom:mushroom-template-card
              entity: sensor.hermes_last_error
              primary: Last error
              secondary: "{{ states('sensor.hermes_last_error') }}"
              icon: mdi:alert-circle-outline
              icon_color: red
              layout: horizontal
              fill_container: true
              card_mod:
                style: |
                  ha-card {
                    border-radius: 12px;
                    border: 1px solid var(--divider-color);
                    border-left: 3px solid #dc2626;
                  }

      - type: grid
        cards:
          - type: heading
            heading: What did it cost today?
            heading_style: title
          - type: custom:mushroom-template-card
            primary: >-
              ${{ states('sensor.hermes_cost_24h') | float(0) | round(4) }}
            secondary: Cost 24h
            icon: mdi:cash-clock
            icon_color: green
            layout: vertical
            tap_action:
              action: more-info
              entity: sensor.hermes_cost_24h
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.hermes_tokens_24h') }}"
            secondary: Tokens 24h
            icon: mdi:counter
            icon_color: blue
            layout: vertical
            tap_action:
              action: more-info
              entity: sensor.hermes_tokens_24h
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.hermes_sessions_24h') }}"
            secondary: Sessions 24h
            icon: mdi:forum-outline
            icon_color: teal
            layout: vertical
            tap_action:
              action: more-info
              entity: sensor.hermes_sessions_24h
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:mushroom-template-card
            primary: >-
              {% set s = states('sensor.hermes_sessions_24h') | float(0) %}
              {% set c = states('sensor.hermes_cost_24h') | float(0) %}
              ${{ (c / s) | round(4) if s > 0 else '0' }}
            secondary: Cost / session
            icon: mdi:cash-multiple
            icon_color: green
            layout: vertical
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:mushroom-template-card
            primary: >-
              {% set c24 = states('sensor.hermes_cost_24h') | float(0) %}
              {% set c7 = states('sensor.hermes_cost_7d') | float(0) %}
              {% set pace = c7 / 7 if c7 > 0 else 0 %}
              {% if pace <= 0 %}n/a
              {% elif c24 <= pace * 1.15 %}On pace
              {% else %}Above normal
              {% endif %}
            secondary: >-
              {% set c24 = states('sensor.hermes_cost_24h') | float(0) %}
              {% set c7 = states('sensor.hermes_cost_7d') | float(0) %}
              {% set pace = c7 / 7 if c7 > 0 else 0 %}
              24h vs 7d avg ${{ pace | round(4) }}
            icon: mdi:speedometer
            icon_color: >-
              {% set c24 = states('sensor.hermes_cost_24h') | float(0) %}
              {% set c7 = states('sensor.hermes_cost_7d') | float(0) %}
              {% set pace = c7 / 7 if c7 > 0 else 0 %}
              {{ 'amber' if pace > 0 and c24 > pace * 1.15 else 'green' }}
            layout: vertical
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:mushroom-template-card
            primary: >-
              ${{ states('sensor.hermes_cost_today') | float(0) | round(4) }}
            secondary: Spent today (calendar)
            icon: mdi:calendar-today
            icon_color: green
            layout: vertical
            tap_action:
              action: more-info
              entity: sensor.hermes_cost_today
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: gauge
            entity: sensor.hermes_budget_used_percent
            name: Monthly budget used
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 70
              red: 90
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:mushroom-template-card
            primary: >-
              ${{ states('sensor.hermes_projected_month_end_cost') | float(0) | round(2) }}
            secondary: >-
              Projected EOM · budget ${{ states('input_number.hermes_monthly_budget_usd') | float(0) | round(0) }}
            icon: mdi:chart-timeline-variant
            icon_color: blue
            layout: horizontal
            fill_container: true
            tap_action:
              action: more-info
              entity: input_number.hermes_monthly_budget_usd
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:apexcharts-card
            header:
              show: true
              title: Cost (24h)
              show_states: true
              colorize_states: true
            graph_span: 24h
            update_interval: 5m
            color_list:
              - '#059669'
              - '#2563eb'
            apex_config:
              chart:
                height: 260
              stroke:
                curve: smooth
                width: 2
            yaxis:
              - id: rolling
                decimals: 4
              - id: cumulative
                opposite: true
                decimals: 4
            series:
              - entity: sensor.hermes_cost_24h
                name: Cost 24h
                yaxis_id: rolling
                type: area
                opacity: 0.25
                stroke_width: 2
              - entity: sensor.hermes_estimated_cost_usd
                name: Estimated total
                yaxis_id: cumulative
                type: line
                stroke_width: 2
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }

      - type: grid
        cards:
          - type: heading
            heading: What can I do about it?
            heading_style: title
          - type: conditional
            conditions:
              - condition: template
                value_template: "{{ states('button.hermes_refresh_status') not in ['unavailable', 'unknown'] }}"
            card:
              type: horizontal-stack
              cards:
                - type: button
                  name: Refresh
                  icon: mdi:refresh
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.hermes_refresh_status
                - type: button
                  name: Backup
                  icon: mdi:cloud-upload-outline
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.hermes_run_backup
                - type: button
                  name: Cleanup
                  icon: mdi:broom
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.hermes_run_cleanup
                - type: button
                  name: Restart GW
                  icon: mdi:restart
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.hermes_restart_gateway
          - type: conditional
            conditions:
              - condition: template
                value_template: "{{ states('select.hermes_approval_mode') not in ['unavailable', 'unknown'] }}"
            card:
              type: entities
              show_header_toggle: false
              entities:
                - entity: select.hermes_approval_mode
                  name: Approval mode (applies after gateway restart)
                - entity: select.hermes_reasoning_effort
                  name: Reasoning effort (applies after gateway restart)
              card_mod:
                style: |
                  ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: markdown
            content: >
              {% if states('button.hermes_refresh_status') in ['unavailable', 'unknown'] %}
              **Controls are disabled.** Turn on `mqtt_settings → Enable MQTT Control Entities`
              in add-on Configuration, then restart the add-on. Only enable on a trusted Mosquitto broker.
              {% else %}
              Changing **approval mode** or **reasoning effort** queues a gateway restart so Hermes
              reloads config. Use **Restart GW** for a manual restart with drain.
              {% endif %}
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }

      - type: grid
        cards:
          - type: heading
            heading: What is it running?
            heading_style: title
          - type: custom:mushroom-entity-card
            entity: sensor.hermes_main_provider
            name: Provider
            icon: mdi:cloud-outline
            layout: horizontal
            fill_container: true
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:mushroom-entity-card
            entity: sensor.hermes_main_model
            name: Model
            icon: mdi:brain
            layout: horizontal
            fill_container: true
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:mushroom-entity-card
            entity: sensor.hermes_auxiliary_title_model
            name: Aux title model
            icon: mdi:text-box-outline
            layout: horizontal
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:mushroom-entity-card
            entity: sensor.hermes_access_mode
            name: Access mode
            icon: mdi:lan
            layout: horizontal
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:mushroom-entity-card
            entity: sensor.hermes_gateway_mode
            name: Gateway mode
            icon: mdi:transit-connection-variant
            layout: horizontal
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:mushroom-entity-card
            entity: sensor.hermes_setup_profile
            name: Setup profile
            icon: mdi:account-cog-outline
            layout: horizontal
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:mushroom-entity-card
            entity: sensor.hermes_addon_version
            name: Add-on
            icon: mdi:package-variant
            layout: horizontal
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:mushroom-entity-card
            entity: sensor.hermes_hermes_agent_version
            name: Hermes Agent
            icon: mdi:robot-outline
            layout: horizontal
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: entity
                entity: binary_sensor.hermes_provider_openrouter
                name: OpenRouter
                content_info: name
              - type: entity
                entity: binary_sensor.hermes_provider_anthropic
                name: Anthropic
                content_info: name
              - type: entity
                entity: binary_sensor.hermes_provider_openai
                name: OpenAI
                content_info: name
              - type: entity
                entity: binary_sensor.hermes_provider_google
                name: Google
                content_info: name
              - type: entity
                entity: binary_sensor.hermes_provider_ollama
                name: Ollama
                content_info: name
              - type: entity
                entity: binary_sensor.hermes_provider_minimax
                name: MiniMax
                content_info: name
              - type: entity
                entity: binary_sensor.hermes_provider_xai
                name: xAI
                content_info: name
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: gauge
            entity: sensor.hermes_disk_usage_percent
            name: Disk (/config)
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 70
              red: 90
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); padding-bottom: 8px; }
          - type: markdown
            content: |
              **Assist / voice** — set `enable_openai_api: true`, then point
              [Extended OpenAI Conversation](https://github.com/jekalmin/extended_openai_conversation)
              at `http://<LAN-IP>:8642/v1` with the gateway token. See DOCS.md → Chat, voice, Assist.
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }

  - title: Analysis
    path: analysis
    icon: mdi:chart-box-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Where did the money go?
            heading_style: title
          - type: custom:mushroom-template-card
            entity: sensor.hermes_top_provider
            primary: "{{ states('sensor.hermes_top_provider') }}"
            secondary: >-
              Top provider · ${{ state_attr('sensor.hermes_top_provider', 'cost_usd') | float(0) | round(4) }}
              · {{ state_attr('sensor.hermes_top_provider', 'total_tokens') | default(0) }} tok
            icon: mdi:cloud
            icon_color: blue
            layout: horizontal
            fill_container: true
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); border-left: 3px solid #2563eb; }
          - type: custom:mushroom-template-card
            entity: sensor.hermes_top_model
            primary: "{{ states('sensor.hermes_top_model') }}"
            secondary: >-
              Top model · ${{ state_attr('sensor.hermes_top_model', 'cost_usd') | float(0) | round(4) }}
              · {{ state_attr('sensor.hermes_top_model', 'total_tokens') | default(0) }} tok
            icon: mdi:cube-outline
            icon_color: purple
            layout: horizontal
            fill_container: true
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); border-left: 3px solid #7c3aed; }
          - type: custom:apexcharts-card
            header:
              show: true
              title: Cost by provider
              show_states: false
            graph_span: 8h
            span:
              end: hour
            update_interval: 5m
            color_list:
              - '#2563eb'
            apex_config:
              chart:
                height: 240
                toolbar:
                  show: false
              plotOptions:
                bar:
                  columnWidth: "70%"
                  borderRadius: 4
              dataLabels:
                enabled: true
              xaxis:
                labels:
                  show: false
              legend:
                show: false
            series:
              - entity: sensor.hermes_usage_summary
                type: column
                name: Cost USD
                float_precision: 4
                unit: USD
                show:
                  datalabels: true
                  in_header: false
                  legend_value: false
                data_generator: |
                  const rows = (entity.attributes.by_provider || []).slice(0, 8);
                  const step = 3600 * 1000;
                  const t0 = end.getTime() - Math.max(rows.length, 1) * step;
                  return rows.map((r, i) => [t0 + i * step, Number(r.cost_usd) || 0]);
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:apexcharts-card
            header:
              show: true
              title: Cost by model
              show_states: false
            graph_span: 8h
            span:
              end: hour
            update_interval: 5m
            color_list:
              - '#7c3aed'
            apex_config:
              chart:
                height: 240
                toolbar:
                  show: false
              plotOptions:
                bar:
                  columnWidth: "70%"
                  borderRadius: 4
              dataLabels:
                enabled: true
              xaxis:
                labels:
                  show: false
              legend:
                show: false
            series:
              - entity: sensor.hermes_usage_summary
                type: column
                name: Cost USD
                float_precision: 4
                unit: USD
                show:
                  datalabels: true
                  in_header: false
                  legend_value: false
                data_generator: |
                  const rows = (entity.attributes.by_model || []).slice(0, 8);
                  const step = 3600 * 1000;
                  const t0 = end.getTime() - Math.max(rows.length, 1) * step;
                  return rows.map((r, i) => [t0 + i * step, Number(r.cost_usd) || 0]);
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: custom:apexcharts-card
            header:
              show: true
              title: Cost by task
              show_states: false
            graph_span: 8h
            span:
              end: hour
            update_interval: 5m
            color_list:
              - '#059669'
            apex_config:
              chart:
                height: 240
                toolbar:
                  show: false
              plotOptions:
                bar:
                  columnWidth: "70%"
                  borderRadius: 4
              dataLabels:
                enabled: true
              xaxis:
                labels:
                  show: false
              legend:
                show: false
            series:
              - entity: sensor.hermes_usage_summary
                type: column
                name: Cost USD
                float_precision: 4
                unit: USD
                show:
                  datalabels: true
                  in_header: false
                  legend_value: false
                data_generator: |
                  const rows = (entity.attributes.by_task || []).slice(0, 8);
                  const step = 3600 * 1000;
                  const t0 = end.getTime() - Math.max(rows.length, 1) * step;
                  return rows.map((r, i) => [t0 + i * step, Number(r.cost_usd) || 0]);
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }

      - type: grid
        cards:
          - type: heading
            heading: How efficient was it?
            heading_style: title
          - type: custom:mushroom-template-card
            primary: >-
              {% set cache = states('sensor.hermes_cache_hit_ratio') | float(0) %}
              {% set oh = states('sensor.hermes_overhead_ratio') | float(0) %}
              {% if cache >= 40 and oh < 25 %}Efficient
              {% elif oh >= 50 %}High overhead
              {% elif cache < 15 %}Low cache hits
              {% else %}Mixed
              {% endif %}
            secondary: Cache / overhead / reasoning snapshot
            icon: mdi:speedometer-medium
            icon_color: >-
              {% set cache = states('sensor.hermes_cache_hit_ratio') | float(0) %}
              {% set oh = states('sensor.hermes_overhead_ratio') | float(0) %}
              {% if cache >= 40 and oh < 25 %}teal
              {% elif oh >= 50 %}red
              {% else %}amber
              {% endif %}
            layout: horizontal
            fill_container: true
            card_mod:
              style: |
                ha-card {
                  border-radius: 12px;
                  border: 1px solid var(--divider-color);
                  border-left: 3px solid #14b8a6;
                }
          - type: gauge
            entity: sensor.hermes_cache_hit_ratio
            name: Cache hit ratio
            min: 0
            max: 100
            severity:
              green: 40
              yellow: 15
              red: 0
            card_mod:
              style: |

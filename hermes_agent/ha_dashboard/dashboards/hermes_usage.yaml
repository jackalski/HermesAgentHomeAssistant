      - type: grid
        cards:
          - type: heading
            heading: Reference
            heading_style: title
          - type: entities
            title: Lifetime totals
            show_header_toggle: false
            entities:
              - entity: sensor.hermes_estimated_cost_usd
                name: Estimated cost
              - entity: sensor.hermes_actual_cost_usd
                name: Actual cost
              - entity: sensor.hermes_total_tokens
                name: Total tokens
              - entity: sensor.hermes_input_tokens_total
                name: Input tokens
              - entity: sensor.hermes_output_tokens_total
                name: Output tokens
              - entity: sensor.hermes_api_call_count_total
                name: API calls
              - entity: sensor.hermes_sessions_total
                name: Sessions
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }
          - type: markdown
            title: Providers (table)
            content: >
              {{ state_attr('sensor.hermes_breakdown_markdown', 'providers')
                 or '_No provider breakdown yet — wait for the next status poll._' }}
            card_mod:
              style: |
                ha-card {
                  border-radius: 12px;
                  border: 1px solid var(--divider-color);
                  overflow-x: auto;
                }
                ha-markdown {
                  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                  font-size: 0.85rem;
                }
          - type: markdown
            title: Models (table)
            content: >
              {{ state_attr('sensor.hermes_breakdown_markdown', 'models')
                 or '_No model breakdown yet._' }}
            card_mod:
              style: |
                ha-card {
                  border-radius: 12px;
                  border: 1px solid var(--divider-color);
                  overflow-x: auto;
                }
                ha-markdown {
                  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                  font-size: 0.85rem;
                }
          - type: markdown
            title: Tasks (table)
            content: >
              {{ state_attr('sensor.hermes_breakdown_markdown', 'tasks')
                 or '_No task breakdown yet (requires session_model_usage in state.db)._' }}
            card_mod:
              style: |
                ha-card {
                  border-radius: 12px;
                  border: 1px solid var(--divider-color);
                  overflow-x: auto;
                }
                ha-markdown {
                  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                  font-size: 0.85rem;
                }
          - type: markdown
            title: How overhead is calculated
            content: |
              These are **proxies**, not absolute waste:

              - **Aux cost / tokens** — `session_model_usage` rows where `task ≠ main`
              - **Compression cost** — task `compression` only
              - **Compression splits** — sessions with a `parent_session_id`
              - **Overhead tokens** ≈ aux + reasoning + cache write
              - **Overhead cost** ≈ aux + session cost share of reasoning + cache write
              - **Overhead ratio** = overhead cost ÷ total cost
              - **Cache hit ratio** = cache read ÷ (input + cache read)
              - **Reasoning share** = reasoning ÷ (output + reasoning)
              - **Failed-session cost** — sessions whose `end_reason` looks like error/timeout/crash
            card_mod:
              style: |
                ha-card { border-radius: 12px; border: 1px solid var(--divider-color); }

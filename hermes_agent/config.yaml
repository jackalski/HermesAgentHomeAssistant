name: Hermes Agent Integration
version: "0.0.46"
slug: hermes_agent
stage: experimental
description: Run Hermes Agent inside Home Assistant via the Hermes Agent Integration add-on.
url: https://github.com/jackalski/HermesAgentHomeAssistant
# Prebuilt multi-arch image (GitHub Actions → GHCR). Supervisor pulls this tag (= version).
image: "ghcr.io/jackalski/hermes-agent-addon"
services:
  - mqtt:want
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
hassio_api: true
homeassistant_api: true
host_network: true

# Home Assistant Ingress (UI inside the add-on page)
ingress: true
ingress_port: 48099
panel_title: Hermes Agent Integration
panel_icon: mdi:robot

map:
  - addon_config:rw
  - share:rw
  - media:rw
options:
  # --- General ---
  # "auto" = detect from Home Assistant Core (Supervisor); fallback Etc/UTC
  timezone: "auto"
  addon_log_level: info

  # --- First-run setup ---
  setup_profile: home_assistant
  default_provider: openrouter
  default_model_preset: custom
  default_model: ""
  # Used when default_provider is lm_studio (OpenAI-compatible local server).
  lm_studio_base_url: "http://127.0.0.1:1234/v1"

  provider_api_keys:
    openai_api_key: ""
    openrouter_api_key: ""
    anthropic_api_key: ""
    google_api_key: ""
    ollama_api_key: ""
    minimax_api_key: ""
    discord_bot_token: ""
    github_token: ""
    xai_api_key: ""
    firecrawl_api_key: ""
    searxng_url: ""

  # --- Home Assistant integration ---
  home_assistant:
    hass_url: ""
    homeassistant_token: ""
    prefer_supervisor_token: true
    auto_configure_mcp: false
    enable_native_ha_platform: false
    ha_system_prompt_hint: ""

  # --- Agent behavior (Hermes config.yaml bootstrap) ---
  agent_behavior:
    approval_mode: smart
    reasoning_effort: medium
    show_reasoning: true

  # --- Webhooks (gateway adapter on host network) ---
  webhooks:
    enable_webhooks: false
    webhook_port: 8644
    seed_ha_direct_delivery_route: true

  # --- Backup to /share ---
  backup:
    auto_backup_on_start: false

  # --- ntfy (optional messaging platform) ---
  ntfy:
    enable_ntfy: false
    ntfy_topic: ""
    ntfy_server_url: "https://ntfy.sh"
    ntfy_token: ""
    # When true: push-only (set publish topic = topic, no inbound allowlist).
    ntfy_publish_only: true

  # --- Web terminal (Ingress) ---
  enable_terminal: true
  terminal_port: 7681

  # --- Hermes Web UI (hermes dashboard) ---
  web_interface:
    enable_web_interface: true
    auto_start_with_integration: true

  # --- Gateway access ---
  gateway_access:
    access_mode: lan_https
    gateway_port: 18789
    gateway_public_url: ""
    enable_openai_api: false
    gateway_mode: local
    gateway_remote_url: ""
    gateway_bind_mode: loopback
    gateway_auth_mode: token
    gateway_trusted_proxies: []
    gateway_additional_allowed_origins: []
    controlui_disable_device_auth: true

  # --- MQTT status sensors ---
  mqtt_settings:
    broker_host: ""
    broker_port: 1883
    broker_username: ""
    broker_password: ""
    enable_ha_status_sensors: true
    publish_mqtt_discovery: true
    enable_control_entities: false
    status_poll_interval_seconds: 60
    state_prefix: "hermes"

  # --- Optional router SSH ---
  router_ssh:
    host: ""
    user: ""
    key_path: "/config/keys/router_ssh"

  # --- Tool bootstrap ---
  tools_bootstrap:
    tool_telegram_enabled: false
    tool_discord_enabled: true
    tool_browser_enabled: true
    tool_skills_hub_enabled: true
    seed_example_scripts: true

  # --- Advanced ---
  advanced_settings:
    http_proxy: ""
    force_ipv4_dns: true
    nginx_log_level: minimal
    gateway_env_vars: []
    hermes_agent_version_preset: custom
    hermes_agent_version_custom: "0.19.0"
    # Bootstrap fallback_providers in Hermes config.yaml when the key is missing.
    # Entries: "provider" or "provider/model" (e.g. openrouter or openrouter/google/gemini-2.5-flash).
    fallback_providers: []
    # When ON, seed use_gateway: true on web/image_gen/tts/browser (Nous Tool Gateway).
    nous_tool_gateway: false
    clean_session_locks_on_start: true
    clean_session_locks_on_exit: true
    gateway_drain_seconds: 15

schema:
  timezone: str
  addon_log_level: list(error|warn|info|debug)?
  setup_profile: list(home_assistant|general|advanced)?
  default_provider: list(nous|openrouter|google|anthropic|ollama|minimax|xai|openai|lm_studio)?
  default_model_preset: list(custom)?
  default_model: str?
  lm_studio_base_url: str?
  provider_api_keys:
    openai_api_key: str?
    openrouter_api_key: str?
    anthropic_api_key: str?
    google_api_key: str?
    ollama_api_key: str?
    minimax_api_key: str?
    discord_bot_token: str?
    github_token: str?
    xai_api_key: str?
    firecrawl_api_key: str?
    searxng_url: str?
  home_assistant:
    hass_url: str?
    homeassistant_token: password?
    prefer_supervisor_token: bool?
    auto_configure_mcp: bool?
    enable_native_ha_platform: bool?
    ha_system_prompt_hint: str?
  agent_behavior:
    approval_mode: list(smart|manual|off)?
    reasoning_effort: list(none|minimal|low|medium|high|xhigh|max|ultra)?
    show_reasoning: bool?
  webhooks:
    enable_webhooks: bool?
    webhook_port: port?
    seed_ha_direct_delivery_route: bool?
  backup:
    auto_backup_on_start: bool?
  ntfy:
    enable_ntfy: bool?
    ntfy_topic: str?
    ntfy_server_url: str?
    ntfy_token: password?
    ntfy_publish_only: bool?
  enable_terminal: bool?
  terminal_port: port?
  web_interface:
    enable_web_interface: bool?
    auto_start_with_integration: bool?
  gateway_access:
    access_mode: list(custom|local_only|lan_https|lan_reverse_proxy|tailnet_https)?
    gateway_port: port?
    gateway_public_url: str?
    enable_openai_api: bool?
    gateway_mode: list(local|remote)?
    gateway_remote_url: str?
    gateway_bind_mode: list(loopback|lan|tailnet)?
    gateway_auth_mode: list(token|trusted-proxy)?
    gateway_trusted_proxies:
      - value: 'match(^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(\/([0-9]|[1-2][0-9]|3[0-2]))?|([0-9a-fA-F:]+)(\/\d{1,3})?)$)'
    gateway_additional_allowed_origins:
      - value: str
    controlui_disable_device_auth: bool?
  mqtt_settings:
    broker_host: str?
    broker_port: port?
    broker_username: str?
    broker_password: password?
    enable_ha_status_sensors: bool?
    publish_mqtt_discovery: bool?
    enable_control_entities: bool?
    status_poll_interval_seconds: int(30,300)?
    state_prefix: str?
  router_ssh:
    host: str?
    user: str?
    key_path: str?
  tools_bootstrap:
    tool_telegram_enabled: bool?
    tool_discord_enabled: bool?
    tool_browser_enabled: bool?
    tool_skills_hub_enabled: bool?
    seed_example_scripts: bool?
  advanced_settings:
    http_proxy: str?
    force_ipv4_dns: bool?
    nginx_log_level: list(full|minimal)?
    gateway_env_vars:
      - name: "match(^[A-Z_][A-Z0-9_]*$)"
        value: str
    hermes_agent_version_preset: list(latest|custom)?
    hermes_agent_version_custom: str?
    fallback_providers:
      - str
    nous_tool_gateway: bool?
    clean_session_locks_on_start: bool?
    clean_session_locks_on_exit: bool?
    gateway_drain_seconds: int(0,120)?
